                    <div>
                      <div style={{ fontSize: 14, fontWeight: 700 }}>{x.product.name}</div>
                      <div style={{ fontSize: 11, color: t.sub }}>{x.qty} dona</div>
                    </div>
                  </div>
                  <div style={{ ...s.mono, fontWeight: 800, color: t.green }}>{fmtK(x.profit)}</div>
                </div>
              </div>
            ))}
          </>
        )}
        {customers.length > 0 && (
          <>
            <Sec>Mijozlar ({customers.length})</Sec>
            {customers.slice(0, 5).map(c => {
              const cSales = sales.filter(s => s.customerId === c.id);
              const cDebt = cSales.reduce((sum, s) => {
                if (s.paid) return sum;
                const pp = (s.partialPayments || []).reduce((a, p) => a + p.amount, 0);
                return sum + (s.totalAmount - pp);
              }, 0);
              const cTotal = cSales.reduce((sum, s) => sum + s.totalAmount, 0);
              return (
                <div key={c.id} style={s.card}>
                  <div style={s.row}>
                    <div>
                      <div style={{ fontSize: 14, fontWeight: 700 }}>👤 {c.name}</div>
                      {c.phone && <div style={{ fontSize: 11, color: t.acc }}>📞 {c.phone}</div>}
                      <div style={{ fontSize: 11, color: t.sub }}>{cSales.length} ta sotuv · {fmtK(cTotal)}</div>
                    </div>
                    <div style={{ textAlign: "right" }}>
                      {cDebt > 0 && <Badge c={t.red} bg={t.redS}>Qarz: {fmtK(cDebt)}</Badge>}
                      {c.phone && (
                        <button onClick={() => window.open(`https://t.me/+${c.phone.replace(/\D/g,"")}`, "_blank")} style={{ marginTop: 6, background: "#229ED9", color: "#fff", borderRadius: 8, padding: "4px 10px", fontSize: 11, fontWeight: 700, display: "block" }}>
                          📨 Telegram
                        </button>
                      )}
                    </div>
                  </div>
                  {cSales.length > 0 && (
                    <div style={{ marginTop: 8, background: t.surf, borderRadius: 8, padding: 8 }}>
                      {cSales.slice(0, 3).map(cs => {
                        const prod = products.find(p => p.id === cs.productId);
                        return (
                          <div key={cs.id} style={{ ...s.row, fontSize: 11, padding: "4px 0", borderBottom: `1px solid ${t.border}33` }}>
                            <span style={{ color: t.sub }}>{dateStr(cs.date)} · {prod?.name}</span>
                            <span style={{ ...s.mono, fontWeight: 700, color: cs.paid ? t.green : t.red }}>{fmt(cs.totalAmount)}</span>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </>
        )}
        {/* OYLIK GRAFIK */}
        {(() => {
          const months = [];
          for (let i = 5; i >= 0; i--) {
            const d = new Date();
            d.setMonth(d.getMonth() - i);
            const key = d.toISOString().slice(0, 7);
            const label = d.toLocaleDateString("uz-UZ", { month: "short" });
            const mSales = sales.filter(s => s.date?.startsWith(key));
            const rev = mSales.reduce((s, x) => s + x.totalAmount, 0);
            const profit = mSales.reduce((s, x) => s + (x.price - x.cost) * x.qty, 0);
            months.push({ key, label, rev, profit });
          }
          const maxVal = Math.max(...months.map(m => m.rev), 1);
          return months.some(m => m.rev > 0) ? (
            <>
              <Sec>Oylik sotuv grafigi</Sec>
              <div style={{ ...s.card, padding: "14px 10px" }}>
                <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 120, marginBottom: 8 }}>
                  {months.map(m => (
                    <div key={m.key} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }}>
                      <div style={{ fontSize: 9, color: t.green, fontWeight: 700 }}>{m.profit > 0 ? fmtK(m.profit) : ""}</div>
                      <div style={{ width: "100%", position: "relative", height: 90, display: "flex", alignItems: "flex-end", gap: 2 }}>
                        <div style={{ flex: 1, background: t.acc, borderRadius: "3px 3px 0 0", height: `${Math.max((m.rev / maxVal) * 90, m.rev > 0 ? 4 : 0)}px`, transition: "height .3s" }} title={`Sotuv: ${fmt(m.rev)}`} />
                        <div style={{ flex: 1, background: t.green, borderRadius: "3px 3px 0 0", height: `${Math.max((m.profit / maxVal) * 90, m.profit > 0 ? 4 : 0)}px`, transition: "height .3s" }} title={`Foyda: ${fmt(m.profit)}`} />
                      </div>
                      <div style={{ fontSize: 9, color: t.sub, fontWeight: 600 }}>{m.label}</div>
                      <div style={{ fontSize: 9, color: t.acc, fontWeight: 700 }}>{m.rev > 0 ? fmtK(m.rev) : "—"}</div>
                    </div>
                  ))}
                </div>
                <div style={{ display: "flex", gap: 16, justifyContent: "center" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11 }}>
                    <div style={{ width: 12, height: 12, background: t.acc, borderRadius: 2 }} />
                    <span style={{ color: t.sub }}>Sotuv</span>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11 }}>
                    <div style={{ width: 12, height: 12, background: t.green, borderRadius: 2 }} />
                    <span style={{ color: t.sub }}>Foyda</span>
                  </div>
                </div>
              </div>
            </>
          ) : null;
        })()}

        {/* DO'KON BO'YICHA */}
        {stores.length > 0 && (
          <>
            <Sec>Do'kon bo'yicha sotuv</Sec>
            {stores.map(st => {
              const stSales = sales.filter(s => s.storeId === st.id);
              const stRev = stSales.reduce((s, x) => s + x.totalAmount, 0);
              const stProfit = stSales.reduce((s, x) => s + (x.price - x.cost) * x.qty, 0);
              const totalRev = sales.reduce((s, x) => s + x.totalAmount, 0);
              const pct = totalRev > 0 ? Math.round((stRev / totalRev) * 100) : 0;
              return (
                <div key={st.id} style={{ ...s.card, marginBottom: 8 }}>
                  <div style={{ ...s.row, marginBottom: 8 }}>
                    <span style={{ fontSize: 13, fontWeight: 700 }}>🏪 {st.name}</span>
                    <span style={{ ...s.mono, fontWeight: 700, color: t.acc }}>{fmtK(stRev)}</span>
                  </div>
                  <div style={{ background: t.border, borderRadius: 4, height: 6, marginBottom: 6 }}>
                    <div style={{ background: t.acc, borderRadius: 4, height: 6, width: `${pct}%`, transition: "width .3s" }} />
                  </div>
                  <div style={{ ...s.row, fontSize: 11 }}>
                    <span style={{ color: t.sub }}>{pct}% umumiydan</span>
                    <span style={{ color: t.green }}>Foyda: {fmtK(stProfit)}</span>
                  </div>
                </div>
              );
            })}
          </>
        )}

        {activity.length > 0 && (
          <>
            <Sec>So'nggi amallar</Sec>
            <div style={{ ...s.card, maxHeight: 320, overflowY: "auto" }}>
              {activity.slice(0, 20).map(a => (
                <div key={a.id} style={{ padding: "9px 0", borderBottom: `1px solid ${t.border}33` }}>
                  <div style={{ fontSize: 12, fontWeight: 700 }}>{a.action}</div>
                  <div style={{ fontSize: 11, color: t.sub, marginTop: 2 }}>{a.details}</div>
                  <div style={{ fontSize: 10, color: t.dim, marginTop: 2, ...s.mono }}>{dateStr(a.time)}</div>
                </div>
              ))}
            </div>
          </>
        )}
      </div>
    );
  };

  const renderPage = () => {
    switch (tab) {
      case "home": return <HomePage />;
      case "warehouse": return <WarehousePage />;
      case "stores": return <StoresPage />;
      case "orders": return <OrdersPage />;
      case "debts": return <DebtsPage />;
      case "report": return <ReportPage />;
      default: return <HomePage />;
    }
  };

  const navItems = [
    { id: "home", l: "Bosh", i: "home" },
    { id: "warehouse", l: "Ombor", i: "warehouse" },
    { id: "stores", l: "Do'kon", i: "store" },
    { id: "orders", l: "Zakaz", i: "order" },
    { id: "debts", l: "Qarz", i: "debt" },
    ...(user?.role !== "moder" ? [{ id: "report", l: "Hisobot", i: "report" }] : []),
  ];
  
  


  const roleLabel = user?.role === "superadmin" ? "👑 Super Admin" : user?.role === "admin" ? "📊 Admin" : "📦 Moder";
  const roleColor = user?.role === "superadmin" ? t.amber : user?.role === "admin" ? t.acc : t.green;

  return (
    <div className="app-layout" style={{ background: t.bg, color: t.txt, minHeight: "100vh" }}>
      <style>{css}</style>

      {/* SIDEBAR OVERLAY mobile */}
      {sidebarOpen && <div onClick={() => setSidebarOpen(false)} style={{ position:"fixed",inset:0,background:"#00000066",zIndex:99,display:"block" }} className="sidebar-overlay"/>}

      {/* SIDEBAR */}
      <aside className={sidebarOpen ? "sidebar sidebar-open" : "sidebar"} style={{ background: t.surf, borderRight: `1px solid ${t.border}` }}>
        <div style={{ padding:"16px 14px", borderBottom:`1px solid ${t.border}`, display:"flex", alignItems:"center", gap:10 }}>
          <div style={{ width:36, height:36, borderRadius:10, background:`linear-gradient(135deg, ${t.acc}, ${t.blue})`, display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontWeight:800, fontSize:16, flexShrink:0 }}>M</div>
          <div className="sid-text">
            <div style={{ fontSize:13, fontWeight:700, color:t.txt }}>Mebel ERP</div>
            <div style={{ fontSize:9, color:syncing ? t.amber : t.green }}>{ syncing ? "⏳ Saqlanmoqda..." : "☁️ Cloud" }</div>
          </div>
        </div>
        <nav style={{ flex:1, padding:"10px 8px", overflowY:"auto" }}>
          {navItems.map(item => {
            const active = tab === item.id;
            return (
              <button key={item.id} onClick={() => { setTab(item.id); localStorage.setItem("kabir_tab", item.id); setStoreProfileId(null); setSidebarOpen(false); }}
                style={{ width:"100%", display:"flex", alignItems:"center", gap:10, padding:"10px", borderRadius:10, marginBottom:2, background:active ? t.accSoft : "transparent", color:active ? t.acc : t.sub, fontWeight:active?700:500, fontSize:13, textAlign:"left", position:"relative" }}>
                <div style={{ position:"relative", flexShrink:0 }}>
                  <Ic n={item.i} s={18} />
                  {item.id === "debts" && stats.debtCount > 0 && (
                    <div style={{ position:"absolute", top:-4, right:-6, minWidth:14, height:14, padding:"0 3px", borderRadius:7, background:t.red, color:"#fff", fontSize:8, fontWeight:800, display:"flex", alignItems:"center", justifyContent:"center" }}>{stats.debtCount}</div>
                  )}
                </div>
                <span className="sid-text">{item.l}</span>
                {active && <div style={{ position:"absolute", left:0, top:"20%", height:"60%", width:3, background:t.acc, borderRadius:"0 3px 3px 0" }} />}
              </button>
            );
          })}
        </nav>
        <div style={{ padding:"12px 10px", borderTop:`1px solid ${t.border}`, display:"flex", alignItems:"center", gap:8 }}>
          <div style={{ width:32, height:32, borderRadius:"50%", background:t.accSoft, display:"flex", alignItems:"center", justifyContent:"center", color:t.acc, fontWeight:800, fontSize:13, flexShrink:0 }}>
            {(user?.username||"U")[0].toUpperCase()}
          </div>
          <div className="sid-text" style={{ flex:1, minWidth:0 }}>
            <div style={{ fontSize:12, fontWeight:700, color:t.txt, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{user?.username}</div>
            <div style={{ fontSize:10, color: user?.role==="superadmin" ? t.amber : user?.role==="admin" ? t.acc : t.green }}>
              {user?.role==="superadmin" ? "👑 Super" : user?.role==="admin" ? "📊 Admin" : "📦 Moder"}
            </div>
          </div>
          <button onClick={() => { setUser(null); localStorage.removeItem("kabir_user"); }} style={{ color:t.red, flexShrink:0, padding:4 }}><Ic n="x" s={14}/></button>
        </div>
      </aside>

      {/* MAIN */}
      <main className="main-content">
        <header style={{ background:t.surf, borderBottom:`1px solid ${t.border}`, padding:"11px 16px", display:"flex", alignItems:"center", justifyContent:"space-between", position:"sticky", top:0, zIndex:50 }}>
          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            <button onClick={() => setSidebarOpen(o => !o)} className="sidebar-toggle" style={{ color:t.sub, padding:4, display:"flex" }}><Ic n="warehouse" s={18}/></button>
            <div style={{ fontSize:14, fontWeight:700, color:t.txt }}>{navItems.find(n=>n.id===tab)?.l || "Bosh"}</div>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:6 }}>
            <div title={!isOnline ? "Internet yo'q" : cloudStatus === "ok" ? "Cloud ulangan" : "Cloud xato"} style={{ width:32, height:32, borderRadius:9, background: (isOnline && cloudStatus === "ok") ? t.greenS : t.redS, display:"flex", alignItems:"center", justifyContent:"center", color: (isOnline && cloudStatus === "ok") ? t.green : t.red }}>
              <Ic n={(isOnline && cloudStatus === "ok") ? "cloud" : "cloudOff"} s={15}/>
            </div>
            <button onClick={loadAll} title="Yangilash" style={{ width:32, height:32, borderRadius:9, background:t.card, border:`1px solid ${t.border}`, display:"flex", alignItems:"center", justifyContent:"center", color:t.txt }}>
              <Ic n="refresh" s={15}/>
            </button>
            <button title="Tungi/kunduzgi rejim" style={{ width:32, height:32, borderRadius:9, background:t.card, border:`1px solid ${t.border}`, display:"flex", alignItems:"center", justifyContent:"center", color:t.txt }} onClick={() => { setDark(d => { 
  const newDark = !d;
  localStorage.setItem("kabir_dark", newDark);
  document.body.style.background = newDark ? "#080810" : "#F2F2F8";
  return newDark;
}); }}>
              <Ic n={dark ? "sun" : "moon"} s={15}/>
            </button>
            <div style={{ position:"relative" }}>
              <button title="Sozlamalar" onClick={() => setSettingsOpen(o => !o)} style={{ width:32, height:32, borderRadius:9, background: settingsOpen ? t.acc : t.card, border:`1px solid ${settingsOpen ? t.acc : t.border}`, display:"flex", alignItems:"center", justifyContent:"center", color: settingsOpen ? "#fff" : t.txt }}>
                <Ic n="settings" s={15}/>
              </button>
              {settingsOpen && (
                <>
                  <div onClick={() => setSettingsOpen(false)} style={{ position:"fixed", inset:0, zIndex:59 }} />
                  <div style={{ position:"absolute", top:40, right:0, width:230, background:t.surf, border:`1px solid ${t.border}`, borderRadius:12, boxShadow:"0 8px 24px rgba(0,0,0,.18)", zIndex:60, overflow:"hidden" }}>
                    <button onClick={exportBackup} style={{ width:"100%", display:"flex", alignItems:"center", gap:10, padding:"11px 12px", textAlign:"left" }}>
                      <div style={{ width:30, height:30, borderRadius:9, background:t.card, display:"flex", alignItems:"center", justifyContent:"center", color:t.acc, flexShrink:0 }}><Ic n="download" s={15}/></div>
                      <div>
                        <div style={{ fontSize:13, fontWeight:700, color:t.txt }}>Backup yuklash</div>
                        <div style={{ fontSize:10.5, color:t.sub }}>Barchasini JSON qilib saqlash</div>
                      </div>
                    </button>
                    <div style={{ borderTop:`1px solid ${t.border}` }} />
                    <button onClick={() => fileInputRef.current?.click()} disabled={importing} style={{ width:"100%", display:"flex", alignItems:"center", gap:10, padding:"11px 12px", textAlign:"left" }}>
                      <div style={{ width:30, height:30, borderRadius:9, background:t.card, display:"flex", alignItems:"center", justifyContent:"center", color:t.amber, flexShrink:0 }}><Ic n="upload" s={15}/></div>
                      <div>
                        <div style={{ fontSize:13, fontWeight:700, color:t.txt }}>{importing ? "Tiklanmoqda..." : "Backup tiklash"}</div>
                        <div style={{ fontSize:10.5, color:t.sub }}>JSON fayldan qayta yuklash</div>
                      </div>
                    </button>
                    <input ref={fileInputRef} type="file" accept="application/json" style={{ display:"none" }} onChange={e => { const f = e.target.files[0]; if (f) importBackup(f); e.target.value = ""; }} />
                  </div>
                </>
              )}
            </div>
            <button title="Chiqish" onClick={() => askConfirm("Chiqish", "Tizimdan chiqmoqchimisiz?", () => { setUser(null); localStorage.removeItem("kabir_user"); }, true)} style={{ width:32, height:32, borderRadius:9, background:t.redS, border:`1px solid ${t.red}44`, display:"flex", alignItems:"center", justifyContent:"center", color:t.red, marginLeft:2 }}>
              <Ic n="logout" s={15}/>
            </button>
          </div>
        </header>
        <div id="main-scroll" style={{ padding:16, paddingBottom:80, overflowY:"auto", height:"calc(100vh - 52px)" }}>
          {/* Pull to refresh indicator */}
          {(pullY > 10 || refreshing) && (
            <div style={{ textAlign:"center", padding:"8px", color:t.acc, fontSize:13, fontWeight:700, marginBottom:8, transform:`translateY(${Math.min(pullY, 60)}px)`, transition: pullY === 0 ? "transform 0.3s" : "none" }}>
              {refreshing ? (
                <span><span className="ptr-spin">🔄</span> Yangilanmoqda...</span>
              ) : pulling ? (
                <span>⬆️ Qo'yib yuboring</span>
              ) : (
                <span>⬇️ Yangilash uchun torting</span>
              )}
            </div>
          )}
          {renderPage()}
        </div>
      </main>

      {/* MOBILE BOTTOM NAV */}
      <nav className="mobile-nav" style={{ background:t.surf, borderTop:`1px solid ${t.border}`, padding:"8px 0 14px" }}>
        {navItems.map(item => {
          const active = tab === item.id;
          return (
            <button key={item.id} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:2, color:active ? t.acc : t.sub, position:"relative" }} onClick={() => { setTab(item.id); localStorage.setItem("kabir_tab", item.id); setStoreProfileId(null); }}>
              <div style={{ position:"absolute", top:0, left:"50%", transform:"translateX(-50%)", height:3, width:active?22:0, background:t.acc, borderRadius:2, transition:"width .25s" }}/>
              <div style={{ position:"relative" }}>
                <Ic n={item.i} s={19}/>
                {item.id==="debts" && stats.debtCount > 0 && (
                  <div style={{ position:"absolute", top:-4, right:-7, minWidth:14, height:14, padding:"0 3px", borderRadius:7, background:t.red, color:"#fff", fontSize:8, fontWeight:800, display:"flex", alignItems:"center", justifyContent:"center" }}>{stats.debtCount}</div>
                )}
              </div>
              <span style={{ fontSize:9, fontWeight:active?700:500 }}>{item.l}</span>
            </button>
          );
        })}
      </nav>

      {modal === "product" && <ProductModal />}
      {modal === "addStock" && <AddStockModal />}
      {modal === "addstore" && <StoreModal />}
      {modal === "transfer" && <TransferModal />}
      {modal === "sell" && <SellModal />}
      {modal === "pay" && <PayModal />}
      {modal === "return" && <ReturnModal />}
      {modal === "order" && <OrderModal />}

      {confirmDialog && (
        <div style={{ position:"fixed", inset:0, background:"#000000CC", zIndex:9999, display:"flex", alignItems:"center", justifyContent:"center" }} onClick={() => setConfirmDialog(null)}>
          <div style={{ background:t.surf, borderRadius:18, width:"100%", maxWidth:360, padding:24, border:`1px solid ${t.border}`, margin:16 }} onClick={e => e.stopPropagation()} className="up">
            <div style={{ textAlign:"center", padding:"8px 0" }}>
              <div style={{ width:60, height:60, borderRadius:18, background:confirmDialog.danger ? t.redS : t.amberS, color:confirmDialog.danger ? t.red : t.amber, display:"flex", alignItems:"center", justifyContent:"center", margin:"0 auto 14px" }}>
                <Ic n={confirmDialog.danger ? "trash" : "alert"} s={26}/>
              </div>
              <div style={{ fontSize:17, fontWeight:800, marginBottom:10 }}>{confirmDialog.title}</div>
              <div style={{ fontSize:13, color:t.sub, lineHeight:1.5, marginBottom:22, whiteSpace:"pre-line" }}>{confirmDialog.message}</div>
            </div>
            <div style={{ display:"flex", gap:9 }}>
              <button onClick={() => setConfirmDialog(null)} style={{ flex:1, background:t.card, border:`1px solid ${t.border}`, color:t.txt, borderRadius:11, padding:"13px", fontWeight:700, fontSize:14 }}>Bekor</button>
              <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog(null); }} style={{ flex:1, background:confirmDialog.danger ? t.red : t.acc, color:"#fff", borderRadius:11, padding:"13px", fontWeight:700, fontSize:14 }}>{confirmDialog.danger ? "🗑️ O'chirish" : "✓ Tasdiqlash"}</button>
            </div>
          </div>
        </div>
      )}

      {printData && (
        <div style={{ position:"fixed", inset:0, background:"#000000CC", zIndex:9999, display:"flex", flexDirection:"column" }}>
          <div style={{ background:"#1A1A30", padding:"12px 16px", display:"flex", alignItems:"center", justifyContent:"space-between", flexShrink:0 }}>
            <div>
              <div style={{ fontSize:14, fontWeight:800, color:"#fff" }}>
                {printData.type === 'yorliq' ? `🖨️ Yorliq — ${printData.count} ta` : '📜 Garantiya taloni'}
              </div>
              <div style={{ fontSize:11, color:"#7777AA", marginTop:2 }}>Ko'rib Ctrl+P bosing</div>
            </div>
            <div style={{ display:"flex", gap:8 }}>
              <button onClick={() => { document.getElementById('printFrame').contentWindow.focus(); document.getElementById('printFrame').contentWindow.print(); }}
                style={{ background:"#7B73FF", color:"#fff", borderRadius:10, padding:"9px 18px", fontWeight:700, fontSize:13, border:"none", cursor:"pointer" }}>🖨️ Print</button>
              <button onClick={() => setPrintData(null)}
                style={{ background:"#22223A", color:"#fff", borderRadius:10, padding:"9px 14px", fontWeight:700, fontSize:13, border:"none", cursor:"pointer" }}>✕</button>
            </div>
          </div>
          <iframe id="printFrame" srcDoc={printData.html} style={{ flex:1, border:"none", background:"white" }} title="Print"/>
        </div>
      )}

    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
// Number input wheel scroll o'chirish
document.addEventListener('wheel', function(e) {
  if (document.activeElement && document.activeElement.type === 'number') {
    document.activeElement.blur();
  }
}, { passive: false });

root.render(<App/>);
</script>
</body>
</html>
