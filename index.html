<script>
// Pull to refresh
let startY = 0, pulling = false;
const ptr = document.getElementById('ptr');
document.addEventListener('touchstart', e => {
  if (window.scrollY === 0) { startY = e.touches[0].clientY; pulling = true; }
}, {passive: true});
document.addEventListener('touchmove', e => {
  if (!pulling) return;
  const dy = e.touches[0].clientY - startY;
  if (dy > 60) ptr.classList.add('ptr-show');
  else ptr.classList.remove('ptr-show');
}, {passive: true});
document.addEventListener('touchend', () => {
  if (ptr.classList.contains('ptr-show')) {
    setTimeout(() => { ptr.classList.remove('ptr-show'); location.reload(); }, 500);
  }
  pulling = false;
});
</script>

const fsGetAll = async (table) => {
  const snap = await fsdb.collection(table).get();
  let rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  // Birinchi ishga tushirishda userlar bo'lmasa — avtomatik yaratamiz
  if (table === "users" && rows.length === 0) {
    const batch = fsdb.batch();
    DEFAULT_USERS.forEach(u => batch.set(fsdb.collection("users").doc(u.id), u));
    await batch.commit();
    rows = DEFAULT_USERS.slice();
  }
  return rows;
};

const db = {
  from(table) {
    const q = {
      _op: "select", _filters: [], _order: null, _limit: null,
      _single: false, _payload: null,
      select() { q._op = "select"; return q; },
      eq(col, val) { q._filters.push(r => r[col] === val); return q; },
      in(col, vals) { q._filters.push(r => vals.includes(r[col])); return q; },
      order(col, opts) { q._order = { col, asc: !!(opts && opts.ascending) }; return q; },
      limit(n) { q._limit = n; return q; },
      single() { q._single = true; return q; },
      insert(payload) { q._op = "insert"; q._payload = payload; return q; },
      upsert(payload) { q._op = "upsert"; q._payload = payload; return q; },
      update(payload) { q._op = "update"; q._payload = payload; return q; },
      delete() { q._op = "delete"; return q; },
      async _run() {
        const match = r => q._filters.every(f => f(r));
        try {
          if (q._op === "select") {
            let out = (await fsGetAll(table)).filter(match);
            if (q._order) {
              const { col, asc } = q._order;
              out.sort((a, b) => {
                const va = a[col] ?? "", vb = b[col] ?? "";
                if (va < vb) return asc ? -1 : 1;
                if (va > vb) return asc ? 1 : -1;
                return 0;
              });
            }
            if (q._limit != null) out = out.slice(0, q._limit);
            if (q._single) return { data: out[0] || null, error: out[0] ? null : { message: "not found" } };
            setCloudStatus("ok");
            return { data: out, error: null };
          }
          if (q._op === "insert" || q._op === "upsert") {
            const items = Array.isArray(q._payload) ? q._payload : [q._payload];
            const batch = fsdb.batch();
            items.forEach(it => {
              const id = it.id ?? (Math.random().toString(36).slice(2) + Date.now());
              const clean = JSON.parse(JSON.stringify({ ...it, id })); // undefined larni tozalash
              batch.set(fsdb.collection(table).doc(String(id)), clean, { merge: q._op === "upsert" });
            });
            await batch.commit();
            setCloudStatus("ok");
            return { data: items, error: null };
          }
          if (q._op === "update") {
            const rows = (await fsGetAll(table)).filter(match);
            const clean = JSON.parse(JSON.stringify(q._payload));
            const batch = fsdb.batch();
            rows.forEach(r => batch.update(fsdb.collection(table).doc(String(r.id)), clean));
            await batch.commit();
            setCloudStatus("ok");
            return { data: null, error: null };
          }
          if (q._op === "delete") {
            const rows = (await fsGetAll(table)).filter(match);
            const batch = fsdb.batch();
            rows.forEach(r => batch.delete(fsdb.collection(table).doc(String(r.id))));
            await batch.commit();
            setCloudStatus("ok");
            return { data: null, error: null };
          }
          setCloudStatus("ok");
          return { data: null, error: { message: "unknown op" } };
        } catch (e) {
          console.error("DB xato:", table, q._op, e);
          setCloudStatus("error"); alert("Baza xatosi: " + e.message);
          return { data: q._single ? null : [], error: e };
        }
      },
      then(res, rej) { q._run().then(res, rej); },
      catch() { return q; },
    };
    return q;
  },
};

  const [pulling, setPulling] = useState(false);
  const [user, setUser] = useState(() => {
    try { const u = localStorage.getItem("kabir_user"); return u ? JSON.parse(u) : null; } catch { return null; }
  });
  const [loginU, setLoginU] = useState("");
  const [loginP, setLoginP] = useState("");
  const [loginErr, setLoginErr] = useState("");
  const [loginLoading, setLoginLoading] = useState(false);

  // QR link (#p=SKU) orqali kelgan mijoz uchun ochiq mahsulot sahifasi
  const publicSku = useMemo(() => {
    const m = window.location.hash.match(/^#p=(.+)$/);
    return m ? decodeURIComponent(m[1]) : null;
  }, []);
  const [publicProd, setPublicProd] = useState(undefined); // undefined=yuklanmoqda, null=topilmadi

  // Cloud holati (yashil/qizil ikonka) va sozlamalar menyusi
  const [cloudStatus, setCloudStatusState] = useState("ok");
  useEffect(() => onCloudStatus(setCloudStatusState), []);
  const [isOnline, setIsOnline] = useState(navigator.onLine);
  useEffect(() => {
    const goOnline = () => setIsOnline(true);
    const goOffline = () => setIsOnline(false);
    window.addEventListener("online", goOnline);
    window.addEventListener("offline", goOffline);
    return () => { window.removeEventListener("online", goOnline); window.removeEventListener("offline", goOffline); };
  }, []);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [importing, setImporting] = useState(false);
  const fileInputRef = useRef(null);

  const exportBackup = () => {
    const data = { products, units, stores, sales, orders, customers, exportDate: now() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "kabir-erp-backup-" + today() + ".json";
    a.click();
    setSettingsOpen(false);
  };

  const importBackup = (file) => {
    const reader = new FileReader();
    reader.onload = async (ev) => {
      let data;
      try { data = JSON.parse(ev.target.result); } catch { alert("Fayl noto'g'ri (JSON emas)"); return; }
      askConfirm("Backup tiklash", "Fayldagi ma'lumotlar mavjudlarga qo'shiladi (bir xil ID bo'lsa yangilanadi). Davom etilsinmi?", async () => {
        setImporting(true);
        try {
          const tables = { products: setProducts, units: setUnits, stores: setStores, sales: setSales, orders: setOrders, customers: setCustomers };
          for (const [tbl, setter] of Object.entries(tables)) {
            const rows = data[tbl];
            if (Array.isArray(rows) && rows.length) {
              await db.from(tbl).upsert(rows);
              setter(prev => {
                const map = new Map(prev.map(r => [r.id, r]));
                rows.forEach(r => map.set(r.id, r));
                return Array.from(map.values());
              });
            }
          }
          await log("Backup tiklandi", file.name);
          alert("Muvaffaqiyatli tiklandi ✅");
        } catch (e) {
          alert("Import xato: " + e.message);
        }
        setImporting(false);
        setSettingsOpen(false);
      }, true);
    };
    reader.readAsText(file);
  };
  useEffect(() => {
    if (!publicSku) return;
    db.from("products").select("*").eq("sku", publicSku).single()
      .then(r => setPublicProd(r.data || null))
      .catch(() => setPublicProd(null));
  }, [publicSku]);

  const doLogin = async () => {
    if (!loginU || !loginP) { setLoginErr("To'ldiring"); return; }
    setLoginLoading(true);
    const { data } = await db.from("users").select("*").eq("username", loginU).eq("password", loginP).single();
    setLoginLoading(false);
    if (data) {
      setUser(data);
      localStorage.setItem("kabir_user", JSON.stringify(data));
      setLoginErr("");
    }
    else setLoginErr("Login yoki parol xato!");
  };

  const canSee = (field) => {
    if (!user) return false;
    if (user.role === "superadmin") return true;
    if (user.role === "admin") { if (field === "users" || field === "price") return false; return true; }
    if (user.role === "moder") { if (field === "cost" || field === "profit" || field === "report") return false; return true; }
    return false;
  };
  const [modal, setModal] = useState(null);
  const [sel, setSel] = useState(null);
  const [storeProfileId, setStoreProfileId] = useState(null);
  const [confirmDialog, setConfirmDialog] = useState(null);
  const [printData, setPrintData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [syncing, setSyncing] = useState(false);

  // DATA
  const [products, setProducts] = useState([]);
  const [units, setUnits] = useState([]);
  const [stores, setStores] = useState([]);
  const [sales, setSales] = useState([]);
  const [orders, setOrders] = useState([]);
  const [customers, setCustomers] = useState([]);
  const [activity, setActivity] = useState([]);

  const t = dark ? THEMES.dark : THEMES.light;

  // ═══════════════════════════════════════════════════════════
  // FIREBASE — MA'LUMOT YUKLASH
  // ═══════════════════════════════════════════════════════════
  const loadAll = useCallback(async () => {
    setLoading(true);
    try {
      const [p, u, st, sa, o, c, a] = await Promise.all([
        db.from("products").select("*").order("created_at", { ascending: false }),
        db.from("units").select("*").order("added_at", { ascending: false }),
        db.from("stores").select("*").order("created_at", { ascending: false }),
        db.from("sales").select("*").order("created_at", { ascending: false }),
        db.from("orders").select("*").order("created_at", { ascending: false }),
        db.from("customers").select("*").order("created_at", { ascending: false }),
        db.from("activity").select("*").order("time", { ascending: false }).limit(10000),
      ]);
      if (p.data) setProducts(p.data.map(x => ({ ...x, costItems: x.cost_items || [] })));
      if (u.data) setUnits(u.data.map(x => ({ ...x, unitId: x.unit_id, productId: x.product_id, addedAt: x.added_at, sentAt: x.sent_at })));
      if (st.data) setStores(st.data);
      if (sa.data) setSales(sa.data.map(x => ({ ...x, unitIds: x.unit_ids || [], storeId: x.store_id, productId: x.product_id, customerId: x.customer_id, customerName: x.customer_name, totalAmount: x.total_amount, payDate: x.pay_date, payMethod: x.pay_method, partialPayments: x.partial_payments || [] })));
      if (o.data) setOrders(o.data.map(x => ({ ...x, orderId: x.order_id, storeId: x.store_id, productId: x.product_id, statusHistory: x.status_history || [] })));
      if (c.data) setCustomers(c.data);
      if (a.data) setActivity(a.data);
    } catch (e) { console.error(e); }
    setLoading(false);
  }, []);

  useEffect(() => { if (user) loadAll(); }, [user, loadAll]);

  useEffect(() => {
    document.body.style.background = dark ? "#080810" : "#F2F2F8";
    document.body.style.color = dark ? "#EEEEF8" : "#1A1A30";
  }, [dark]);

  const doRefresh = async () => {
    if (refreshing) return;
    setRefreshing(true);
    await loadAll();
    setRefreshing(false);
  };

  useEffect(() => {
    let startY = 0;
    let isDragging = false;
    const el = document.getElementById('main-scroll');
    if (!el) return;

    const onTouchStart = (e) => {
      if (el.scrollTop === 0) {
        startY = e.touches[0].clientY;
        isDragging = true;
      }
    };
    const onTouchMove = (e) => {
      if (!isDragging) return;
      const dy = e.touches[0].clientY - startY;
      if (dy > 0 && dy < 80) {
        setPullY(dy);
        setPulling(dy > 50);
      }
    };
    const onTouchEnd = () => {
      if (pulling) doRefresh();
      setPullY(0);
      setPulling(false);
      isDragging = false;
    };

    el.addEventListener('touchstart', onTouchStart, { passive: true });
    el.addEventListener('touchmove', onTouchMove, { passive: true });
    el.addEventListener('touchend', onTouchEnd);
    return () => {
      el.removeEventListener('touchstart', onTouchStart);
      el.removeEventListener('touchmove', onTouchMove);
      el.removeEventListener('touchend', onTouchEnd);
    };
  }, [pulling, refreshing, user]);

  

  // ═══════════════════════════════════════════════════════════
  // FIREBASE — SAQLASH FUNKSIYALARI
  // ═══════════════════════════════════════════════════════════
  const dbSave = async (table, data) => {
    setSyncing(true);
    try {
      await db.from(table).upsert(data);
    } catch (e) { console.error(e); }
    setSyncing(false);
  };

  const dbDelete = async (table, id) => {
    setSyncing(true);
    try { await db.from(table).delete().eq("id", id); } catch (e) { console.error(e); }
    setSyncing(false);
  };

  const dbDeleteMany = async (table, ids) => {
    setSyncing(true);
    try { await db.from(table).delete().in("id", ids); } catch (e) { console.error(e); }
    setSyncing(false);
  };

  const log = async (action, details) => {
    const entry = { id: uid(), action, details, time: now() };
    setActivity(prev => [entry, ...prev].slice(0, 10000));
    await db.from("activity").insert(entry);
  };

  // ═══════════════════════════════════════════════════════════
  // HELPER FUNKSIYALAR
  // ═══════════════════════════════════════════════════════════
  const askConfirm = (title, message, onConfirm, danger = false) => setConfirmDialog({ title, message, onConfirm, danger });

  // To'qnashuv himoyasi: yozishdan oldin shu unitlar boshqa birov tomonidan
  // (masalan boshqa qurilmadan) allaqachon o'zgartirilmaganini tekshiradi.
  const verifyUnitsUnchanged = async (unitIds) => {
    if (!unitIds || unitIds.length === 0) return true;
    try {
      const { data: fresh } = await db.from("units").select("*").in("id", unitIds);
      const localMap = new Map(units.map(u => [u.id, u]));
      const changed = (fresh || []).filter(f => {
        const local = localMap.get(f.id);
        return local && (local.location !== f.location || local.status !== f.status);
      });
      if (changed.length > 0) {
        const names = changed.map(u => u.unitId || u.unit_id).join(", ");
        return window.confirm(`⚠️ Diqqat: ${names} — boshqa birov tomonidan allaqachon o'zgartirilgan (joyi/holati boshqacha bo'lib qolgan). Baribir davom etilsinmi?`);
      }
      return true;
    } catch (e) {
      console.error("verifyUnitsUnchanged xato:", e);
      return true; // tekshiruv ishlamasa ham asosiy amalni to'xtatib qo'ymaymiz
    }
  };
  const generateUnitId = (sku, num) => `${sku}-#${num}`;
  const getWhUnits = (pid) => units.filter(u => u.productId === pid && u.location === "warehouse" && u.status === "available");
  const getStoreUnits = (sid, pid = null) => units.filter(u => u.location === sid && u.status === "available" && (pid === null || u.productId === pid));
  const getStoreUnitsByProduct = (sid) => {
    const r = {};
    units.filter(u => u.location === sid && u.status === "available").forEach(u => {
      if (!r[u.productId]) r[u.productId] = [];
      r[u.productId].push(u);
    });
    return r;
  };

  const stats = useMemo(() => {
    const totalSales = sales.reduce((s, x) => s + x.totalAmount, 0);
    const totalProfit = sales.reduce((s, x) => s + (x.price - x.cost) * x.qty, 0);
    const totalPaid = sales.reduce((s, x) => {
      const pp = (x.partialPayments || []).reduce((a, p) => a + p.amount, 0);
      return s + (x.paid ? x.totalAmount : pp);
    }, 0);
    const totalCustomerDebt = sales.reduce((s, x) => {
      if (x.paid) return s;
      const pp = (x.partialPayments || []).reduce((a, p) => a + p.amount, 0);
      return s + (x.totalAmount - pp);
    }, 0);
    let totalVitrinaDebt = 0;
    units.filter(u => u.location !== "warehouse" && u.status === "available").forEach(u => {
      const p = products.find(x => x.id === u.productId);
      if (p) totalVitrinaDebt += p.price;
    });
    const debtCount = sales.filter(x => !x.paid).length;
    return { totalSales, totalProfit, totalPaid, totalCustomerDebt, totalVitrinaDebt, debtCount };
  }, [sales, units, products]);

  // ═══════════════════════════════════════════════════════════
  // PDF HISOBOTLAR
  // ═══════════════════════════════════════════════════════════
  const [pdfLoading, setPdfLoading] = useState(null);

  const openReportPdf = async (type, data) => {
    setPdfLoading(type);
    try {
      const res = await fetch("/api/pdf.py", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type, data }),
      });
      if (!res.ok) { const msg = await res.text(); throw new Error(msg); }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      window.open(url, "_blank");
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    } catch (e) {
      alert("PDF xato: " + e.message);
    }
    setPdfLoading(null);
  };

  const pdfHome = () => {
    const rows = activity.slice(0, 300).map(a => ({
      date: dateStr(a.time), action: a.action, product: a.details, location: "", amount: null,
    }));
    openReportPdf("home", { range: `So'nggi ${rows.length} ta harakat`, rows });
  };

  const pdfWarehouse = () => {
    const rows = products.map(pr => {
      const prodUnits = units.filter(u => u.productId === pr.id);
      const warehouse = prodUnits.filter(u => u.location === "warehouse" && u.status === "available").length;
      const perStore = stores.map(st => prodUnits.filter(u => u.location === st.id && u.status === "available").length);
      const sold = prodUnits.filter(u => u.status === "sold").length;
      return { name: pr.name, sku: pr.sku, total: prodUnits.length, warehouse, perStore, sold };
    });
    openReportPdf("warehouse", { asOf: today(), stores: stores.map(s => s.name), rows });
  };

  const pdfStore = (storeId) => {
    const store = stores.find(s => s.id === storeId);
    const storeUnits = units.filter(u => u.location === storeId);
    const incomingMap = {};
    storeUnits.forEach(u => {
      const pr = products.find(p => p.id === u.productId);
      const key = dateStr(u.sentAt || u.addedAt) + "|" + (pr?.name || "-");
      if (!incomingMap[key]) incomingMap[key] = { date: dateStr(u.sentAt || u.addedAt), product: pr?.name || "-", qty: 0 };
      incomingMap[key].qty += 1;
    });
    const storeSales = sales.filter(s => s.storeId === storeId);
    const cash = [];
    storeSales.forEach(s => {
      const pr = products.find(p => p.id === s.productId);
      const methodLabel = { cash: "Naqd", card: "Karta", transfer: "O'tkazma" }[s.payMethod] || s.payMethod || "-";
      if (s.paid) cash.push({ date: dateStr(s.payDate || s.date), product: pr?.name || "-", method: methodLabel, amount: s.totalAmount });
      (s.partialPayments || []).forEach(pp => cash.push({ date: dateStr(pp.date), product: pr?.name || "-", method: { cash: "Naqd", card: "Karta" }[pp.method] || pp.method || "-", amount: pp.amount }));
    });
    const debts = storeSales.filter(s => !s.paid).map(s => {
      const pp = (s.partialPayments || []).reduce((a, x) => a + x.amount, 0);
      return { customer: s.customerName || "-", taken: dateStr(s.date), closed: null, amount: s.totalAmount - pp };
    });
    openReportPdf("stores", {
      storeName: store?.name || "", range: today(),
      incoming: Object.values(incomingMap), cash, debts,
    });
  };

  const pdfOrders = () => {
    const rows = orders.map(o => {
      const pr = products.find(p => p.id === o.productId);
      const st = stores.find(s => s.id === o.storeId);
      const doneEntry = (o.statusHistory || []).find(h => h.status === "delivered");
      return {
        product: pr?.name || "-", store: st?.name || "-",
        given: dateStr(o.created_at), done: doneEntry ? dateStr(doneEntry.time) : null,
        price: o.price, status: ORDER_STATUS[o.status]?.label || o.status,
      };
    });
    openReportPdf("orders", { range: today(), rows });
  };

  const pdfDebts = () => {
    const unpaid = sales.filter(s => !s.paid);
    const rows = unpaid.map(s => {
      const pp = (s.partialPayments || []).reduce((a, x) => a + x.amount, 0);
      const st = stores.find(x => x.id === s.storeId);
      return { customer: s.customerName || "-", store: st?.name || "-", taken: dateStr(s.date), closed: null, amount: s.totalAmount - pp };
    });
    openReportPdf("debts", { asOf: today(), openTotal: stats.totalCustomerDebt, closedTotal: 0, rows });
  };

  const pdfReport = () => {
    const byProduct = {};
    sales.forEach(s => {
      if (!byProduct[s.productId]) byProduct[s.productId] = { sold: 0, revenue: 0 };
      byProduct[s.productId].sold += s.qty;
      byProduct[s.productId].revenue += s.totalAmount;
    });
    const bestsellers = Object.entries(byProduct).map(([pid, v]) => {
      const pr = products.find(p => p.id === pid);
      return { name: pr?.name || "-", sku: pr?.sku || "", sold: v.sold, revenue: v.revenue };
    }).sort((a, b) => b.sold - a.sold).slice(0, 10);

    const byStore = {};
    sales.forEach(s => {
      if (!byStore[s.storeId]) byStore[s.storeId] = { sales: 0, profit: 0 };
      byStore[s.storeId].sales += s.totalAmount;
      byStore[s.storeId].profit += (s.price - s.cost) * s.qty;
    });
    const storeRanking = Object.entries(byStore).map(([sid, v]) => {
      const st = stores.find(x => x.id === sid);
      return { store: st?.name || "-", sales: v.sales, profit: v.profit };
    }).sort((a, b) => b.sales - a.sales);

    openReportPdf("report", {
      range: today(),
      totals: { sales: stats.totalSales, profit: stats.totalProfit, loss: 0 },
      bestsellers, storeRanking,
    });
  };

              ${prod.dimensions ? `<div class="row"><span>O'lcham:</span><span>${prod.dimensions}</span></div>` : ''}
              <div class="row"><span>Kategoriya:</span><span>${prod.category}</span></div>

          <div class="contact">+998 20 000 00 74 · Yangiyo'l, Qirariq</div>
        </div>
      </div>`;
    }).join('');
    const siteUrl = window.location.origin;
    const barcodeScripts = printUnits.map((u, idx) => {

      return `JsBarcode("#bc${idx}","${u.unitId}",{format:"CODE128",width:2.5,height:50,displayValue:true,fontSize:15,margin:2,font:"Courier New"});new QRCode(document.getElementById("qr${idx}"),{text:"${qrUrl}",width:62,height:62,correctLevel:QRCode.CorrectLevel.M});`;
    }).join('');
    return `<!DOCTYPE html><html><head><meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"><\/script>

    <style>

    .name{font-size:13px;font-weight:bold;text-align:center;margin:1mm 0}
    .bcwrap{text-align:center;line-height:0}

    .info{font-size:10px;flex:1}
    .row{display:flex;justify-content:space-between;margin:0.7mm 0}
    .row span:first-child{color:#666}

    .contact{text-align:center;font-size:9px;color:#888;margin-top:1.5mm}
    @media print{body{margin:0}}
    </style></head><body>${pages}
    <script>window.onload=function(){${barcodeScripts};setTimeout(()=>{window.print();},700);}<\/script>
    </body></html>`;
  };

  const buildGarantiyaHtml = (unitIds) => {
    const garUnits = units.filter(u => unitIds.includes(u.id));
    const pages = garUnits.map((u, idx) => {
      const prod = products.find(p => p.id === u.productId);
      if (!prod) return '';
      return `<div class="gar">
        <div class="band"><div class="brand">KABIR EXCLUSIVE</div><div class="sub">MEBEL ISHLAB CHIQARISH</div></div>
        <div class="body">
          <div class="name">${prod.name}</div>
          <div class="id">${u.unitId}</div>
          <div class="bcwrap"><svg id="gc${idx}"></svg></div>
          <hr class="div">

                      }} style={{ background: t.green, color: "#fff", borderRadius: 9, padding: "0 14px", fontWeight: 700, fontSize: 13 }}>✓</button>
                      <button onClick={() => setEditingCostId(null)} style={{ background: t.card, border: `1px solid ${t.border}`, color: t.sub, borderRadius: 9, padding: "0 12px", fontWeight: 700 }}>✕</button>

                    <button style={{ color: t.red, padding: 4 }} onClick={() => setF(p => ({ ...p, costItems: p.costItems.filter(x => x.id !== item.id) }))}><Ic n="trash" s={15} /></button>
                  </div>
                )}

            ))}
            <div style={{ background: t.card, border: `1.5px dashed ${t.acc}55`, borderRadius: 11, padding: 12, marginBottom: 10 }}>

              <div style={{ display: "flex", gap: 8 }}>
                <input type="number" inputMode="decimal" step="0.01" style={{ ...s.inp, marginBottom: 0, flex: 1 }} placeholder="Summa ($)" value={cAmt} onChange={e => setCAmt(e.target.value)} onKeyDown={e => e.key === "Enter" && addCost()} />
                <button onClick={addCost} style={{ background: t.acc, color: "#fff", borderRadius: 10, padding: "0 16px", fontWeight: 700, fontSize: 18 }}>+</button>

              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 10 }}>
                {["MDF", "Lak", "Zborka", "Temir", "Yelim", "Mato", "Charm", "Shisha", "Dostavka", "Upakovka", "Ish haqi"].map(q => (
                  <button key={q} onClick={() => setCName(q)} style={{ background: cName === q ? t.acc : t.surf, color: cName === q ? "#fff" : t.sub, border: `1px solid ${cName === q ? t.acc : t.border}`, borderRadius: 14, padding: "4px 10px", fontSize: 11, fontWeight: 600 }}>{q}</button>
                ))}
              </div>
            </div>
            {totalCost > 0 && (
              <div style={{ background: t.accSoft, borderRadius: 11, padding: 12, marginBottom: 12 }}>
                <div style={s.row}><span style={{ fontSize: 12, color: t.sub }}>JAMI TANNARX</span><span style={{ ...s.mono, fontWeight: 800, color: t.acc, fontSize: 16 }}>{fmt(totalCost)}</span></div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>
            <div><Lbl>Ustama %</Lbl><NumInp value={f.markup} onChange={onMarkupChange} placeholder="30" /></div>
            <div><Lbl>Sotuv narxi ($)</Lbl><NumInp value={f.salePrice} onChange={onPriceChange} placeholder="60" /></div>
          </div>
          <div style={{ fontSize: 11, color: t.sub, marginTop: -4, marginBottom: 12 }}>💡 Birortasini yozsangiz, ikkinchisi avtomatik</div>
          {totalCost > 0 && price > 0 && (
            <div style={{ background: `${t.green}12`, border: `1px solid ${t.green}30`, borderRadius: 12, padding: 14, marginBottom: 12 }}>
              <div style={{ ...s.row, marginBottom: 8 }}><span style={{ fontSize: 12, color: t.sub }}>Tannarx</span><span style={{ ...s.mono, fontWeight: 700 }}>{fmt(totalCost)}</span></div>
              <div style={{ ...s.row, marginBottom: 8 }}><span style={{ fontSize: 12, color: t.sub }}>Sotuv narxi</span><span style={{ ...s.mono, fontWeight: 700, color: t.acc }}>{fmt(price)}</span></div>
              <div style={{ borderTop: `1px dashed ${t.border}`, paddingTop: 10 }}>
                <div style={{ ...s.row, marginBottom: 4 }}><span style={{ fontSize: 13, fontWeight: 700 }}>FOYDA</span><span style={{ ...s.mono, fontWeight: 800, color: t.green, fontSize: 17 }}>{fmt(profit)}</span></div>
                <div style={s.row}><span style={{ fontSize: 11, color: t.sub }}>Ustama</span><span style={{ ...s.mono, fontWeight: 700, color: profitPct >= 0 ? t.green : t.red }}>{profitPct}%</span></div>
              </div>
            </div>
          )}
          <Btn bg={t.acc} onClick={save} disabled={saving}>{saving ? "Saqlanmoqda..." : existing ? "Saqlash" : "Mahsulot qo'shish"}</Btn>
        </div>
      </div>
    );
  };

  // ═══════════════════════════════════════════════════════════
  // MODAL: ADD STOCK
  // ═══════════════════════════════════════════════════════════
  const AddStockModal = () => {
    const product = products.find(p => p.id === sel?.productId);
    const [qty, setQty] = useState("");
    const [addedDate, setAddedDate] = useState(today());
    const [location, setLocation] = useState("warehouse");
    const [saving, setSaving] = useState(false);
    if (!product) return null;
    const existingCount = units.filter(u => u.productId === product.id).length;

    const add = async () => {
      const q = +qty;
      if (!q || q <= 0) return alert("Sonini kiriting");
      setSaving(true);
      const newUnits = [];
      for (let i = 1; i <= q; i++) {
        newUnits.push({
          id: uid(),
          unit_id: generateUnitId(product.sku, pad4(existingCount + i)),
          product_id: product.id,
          location: location,
          status: "available",
          added_at: addedDate + "T00:00:00.000Z",
          sent_at: location !== "warehouse" ? addedDate + "T00:00:00.000Z" : null,
        });
      }
      await db.from("units").insert(newUnits);
      setUnits(prev => [...newUnits.map(u => ({ ...u, unitId: u.unit_id, productId: u.product_id, addedAt: u.added_at })), ...prev]);
      await log("Ombor to'ldirildi", `${product.name} — ${q} dona`);
      setSaving(false);
      setModal(null); setSel(null);
    };

    return (
      <div style={s.overlay} onClick={() => { setModal(null); setSel(null); }}>
        <div style={s.sheet} onClick={e => e.stopPropagation()} className="up">
          <div style={{ ...s.row, marginBottom: 16 }}>
            <span style={{ fontSize: 17, fontWeight: 800 }}>➕ Omborga qo'shish</span>
            <button style={s.iBtn} onClick={() => { setModal(null); setSel(null); }}><Ic n="x" s={16} /></button>
          </div>
          <div style={{ background: t.accSoft, borderRadius: 11, padding: 13, marginBottom: 14 }}>
            <div style={{ fontSize: 14, fontWeight: 700 }}>{product.name}</div>
            <div style={{ fontSize: 11, color: t.sub, ...s.mono }}>{product.sku}</div>
          </div>
          <Lbl>Qo'shilgan sana</Lbl>
          <input type="date" style={s.inp} value={addedDate} onChange={e => setAddedDate(e.target.value)} />
          <Lbl>Joylashuv</Lbl>
          <select style={s.inp} value={location} onChange={e => setLocation(e.target.value)}>
            <option value="warehouse">📦 Ombor</option>
            {stores.map(st => <option key={st.id} value={st.id}>🏪 {st.name}</option>)}
          </select>
          <Lbl>Nechta qo'shasiz</Lbl>
          <NumInp value={qty} onChange={setQty} placeholder="Masalan: 10" />
          {+qty > 0 && (
            <div style={{ background: t.card, borderRadius: 10, padding: 11, marginBottom: 11, fontSize: 12 }}>
              <div style={{ color: t.sub, marginBottom: 4 }}>Avtomatik ID:</div>
              <div style={{ ...s.mono, color: t.acc, fontWeight: 700 }}>
                {generateUnitId(product.sku, pad4(existingCount + 1))} → {generateUnitId(product.sku, pad4(existingCount + (+qty)))}
              </div>
              {location !== "warehouse" && <div style={{ marginTop: 8, padding: "7px 10px", background: t.amberS, borderRadius: 8, fontSize: 11, color: t.amber }}>⚠️ Vitrinaga to'g'ridan qo'shiladi</div>}
            </div>
          )}
          <Btn bg={t.acc} onClick={add} disabled={saving}>{saving ? "Saqlanmoqda..." : "✓ Qo'shish"}</Btn>
        </div>
      </div>
    );
  };

  // MODAL: STORE
  // ═══════════════════════════════════════════════════════════
  const StoreModal = () => {
    const existing = sel?.editStore;
    const [f, setF] = useState(existing
      ? { name: existing.name || "", address: existing.address || "", manager: existing.manager || "", phone: existing.phone || "" }
      : { name: "", address: "", manager: "", phone: "" });
    const [saving, setSaving] = useState(false);
    const save = async () => {
      if (!f.name) return alert("Nomi to'ldiring");
      setSaving(true);
      if (existing) {
        await db.from("stores").update(f).eq("id", existing.id);
        setStores(prev => prev.map(x => x.id === existing.id ? { ...x, ...f } : x));
        await log("Do'kon tahrirlandi", f.name);
      } else {
        const newStore = { id: uid(), ...f, created_at: now() };
        await db.from("stores").insert(newStore);
        setStores(p => [newStore, ...p]);
        await log("Do'kon qo'shildi", f.name);
      }
      setSaving(false);
      setModal(null); setSel(null);
    };
    return (
      <div style={s.overlay} onClick={() => { setModal(null); setSel(null); }}>
        <div style={s.sheet} onClick={e => e.stopPropagation()} className="up">
          <div style={{ ...s.row, marginBottom: 16 }}>
            <span style={{ fontSize: 17, fontWeight: 800 }}>{existing ? "Do'konni tahrirlash" : "Yangi do'kon"}</span>
            <button style={s.iBtn} onClick={() => { setModal(null); setSel(null); }}><Ic n="x" s={16} /></button>
          </div>
          <Lbl>Do'kon nomi *</Lbl>
          <input style={s.inp} placeholder="Chilonzor Showroom" value={f.name} onChange={e => setF(p => ({ ...p, name: e.target.value }))} />
          <Lbl>Manzil</Lbl>
          <input style={s.inp} placeholder="Manzil" value={f.address} onChange={e => setF(p => ({ ...p, address: e.target.value }))} />
          <Lbl>Mas'ul shaxs</Lbl>
          <input style={s.inp} placeholder="Ism Familiya" value={f.manager} onChange={e => setF(p => ({ ...p, manager: e.target.value }))} />
          <Lbl>Telefon</Lbl>
          <input style={s.inp} placeholder="+998 90 ..." value={f.phone} onChange={e => setF(p => ({ ...p, phone: e.target.value }))} />
          <Btn bg={t.acc} onClick={save} disabled={saving}>{saving ? "Saqlanmoqda..." : (existing ? "Saqlash" : "Qo'shish")}</Btn>

  // ═══════════════════════════════════════════════════════════
  // MODAL: TRANSFER
  // ═══════════════════════════════════════════════════════════
  const TransferModal = () => {
    const [storeId, setStoreId] = useState(sel?.storeId || stores[0]?.id || "");
    const [productId, setProductId] = useState("");
    const [qty, setQty] = useState("");
    const [sentDate, setSentDate] = useState(today());
    const [saving, setSaving] = useState(false);
    const [scanMode, setScanMode] = useState(false);
    const [scannedIds, setScannedIds] = useState([]);
    const [scanInput, setScanInput] = useState("");
    const [scanErr, setScanErr] = useState("");
    const [transferList, setTransferList] = useState([]);

    const handleScanInput = (val) => {
      setScanInput(val);
      setScanErr("");
    };

    const addScannedId = () => {
      const trimmed = scanInput.trim();
      if (!trimmed) return;
      const unit = units.find(u => u.unitId === trimmed && u.location === "warehouse" && u.status === "available");
      if (!unit) { setScanErr(`❌ ${trimmed} — omborda yo'q!`); return; }
      if (scannedIds.find(s => s.unitId === trimmed)) { setScanErr("⚠️ Allaqachon qo'shilgan!"); return; }
      const prod = products.find(p => p.id === unit.productId);
      setScannedIds(prev => [...prev, { ...unit, prodName: prod?.name || "—" }]);
      setScanInput("");
      setScanErr("");
    };

    if (stores.length === 0 || products.length === 0) {
      return (
        <div style={s.overlay} onClick={() => setModal(null)}>
          <div style={s.sheet} onClick={e => e.stopPropagation()} className="up">
            <div style={{ ...s.row, marginBottom: 16 }}>
              <span style={{ fontSize: 17, fontWeight: 800 }}>Jo'natish</span>
              <button style={s.iBtn} onClick={() => setModal(null)}><Ic n="x" s={16} /></button>
            </div>
            <div style={{ textAlign: "center", padding: 30, color: t.sub, fontSize: 13 }}>{stores.length === 0 ? "⚠️ Avval do'kon qo'shing" : "⚠️ Avval mahsulot qo'shing"}</div>
          </div>
        </div>
      );
    }

    const availProds = products.filter(p => getWhUnits(p.id).length > 0);
    const availUnits = productId ? getWhUnits(productId) : [];
    const product = products.find(p => p.id === productId);
    const qtyN = +qty || 0;

    const send = async () => {
      if (!storeId) return alert("Do'kon tanlang");
      setSaving(true);
      let toSend = [];
      if (scanMode && scannedIds.length > 0) {
        toSend = scannedIds;
      } else if (transferList.length > 0) {
        // Ko'p mahsulot jo'natish
        for (const item of transferList) {
          const whUnits = units.filter(u => u.productId === item.productId && u.location === "warehouse" && u.status === "available");
          if (item.qty > whUnits.length) {
            setSaving(false);
            return alert(`${item.name}: omborda faqat ${whUnits.length} dona`);
          }
          toSend = [...toSend, ...whUnits.slice(0, item.qty)];
        }
      } else {
        if (!productId) { setSaving(false); return alert("Mahsulot tanlang"); }
        if (!qtyN || qtyN <= 0) { setSaving(false); return alert("Sonini kiriting"); }
        if (qtyN > availUnits.length) { setSaving(false); return alert(`Omborda ${availUnits.length} dona`); }
        toSend = availUnits.slice(0, qtyN);
      }
      if (toSend.length === 0) { setSaving(false); return alert("Mol tanlanmagan"); }
      const ok = await verifyUnitsUnchanged(toSend.map(u => u.id));
      if (!ok) { setSaving(false); return; }
      const updates = toSend.map(u => ({
        id: u.id,
        unit_id: u.unitId,
        product_id: u.productId,
        location: storeId,
        status: "available",
        added_at: u.addedAt,
        sent_at: sentDate + "T00:00:00.000Z",
      }));
      const { error: upsertErr } = await db.from("units").upsert(updates);
      if (upsertErr) { console.error("Upsert error:", upsertErr); alert("Xato: " + upsertErr.message); setSaving(false); return; }
      setUnits(prev => prev.map(u => toSend.find(x => x.id === u.id) ? { ...u, location: storeId, sentAt: sentDate } : u));
      const store = stores.find(st => st.id === storeId);
      await log("Vitrinaga jo'natildi", `${toSend.length} dona → ${store.name}`);
      setSaving(false);
      setModal(null); setSel(null);
    };

    return (
      <div style={s.overlay} onClick={() => { setModal(null); setSel(null); }}>
        <div style={s.sheet} onClick={e => e.stopPropagation()} className="up">
          <div style={{ ...s.row, marginBottom: 16 }}>
            <span style={{ fontSize: 17, fontWeight: 800 }}>📦 Vitrinaga jo'natish</span>
            <button style={s.iBtn} onClick={() => { setModal(null); setSel(null); }}><Ic n="x" s={16} /></button>
          </div>
          <Lbl>Jo'natish sanasi</Lbl>
          <input type="date" style={s.inp} value={sentDate} onChange={e => setSentDate(e.target.value)} />
          <Lbl>Qaysi do'konga</Lbl>
          <select style={s.inp} value={storeId} onChange={e => setStoreId(e.target.value)}>{stores.map(st => <option key={st.id} value={st.id}>{st.name}</option>)}</select>
          <Lbl>Mahsulot</Lbl>
          <select style={s.inp} value={productId} onChange={e => setProductId(e.target.value)}>
            <option value="">— tanlang —</option>
            {availProds.map(p => <option key={p.id} value={p.id}>{p.name} (omborda: {getWhUnits(p.id).length})</option>)}
          </select>
          {product && <div style={{ background: t.accSoft, borderRadius: 10, padding: "10px 12px", marginBottom: 11, fontSize: 12 }}><div style={s.row}><span style={{ color: t.sub }}>Omborda:</span><span style={{ ...s.mono, fontWeight: 800, color: t.acc }}>{availUnits.length} dona</span></div></div>}
          {/* Scanner/Qo'lda rejimi */}
          <div style={{ display: "flex", gap: 6, marginBottom: 11 }}>
            <button onClick={() => { setScanMode(false); setScannedIds([]); }} style={{ flex: 1, padding: "9px", borderRadius: 9, background: !scanMode ? t.acc : t.card, color: !scanMode ? "#fff" : t.sub, border: `1px solid ${!scanMode ? t.acc : t.border}`, fontWeight: 700, fontSize: 12 }}>📋 Qo'lda</button>
            <button onClick={() => setScanMode(true)} style={{ flex: 1, padding: "9px", borderRadius: 9, background: scanMode ? t.acc : t.card, color: scanMode ? "#fff" : t.sub, border: `1px solid ${scanMode ? t.acc : t.border}`, fontWeight: 700, fontSize: 12 }}>📷 Scanner</button>
          </div>

          {!scanMode ? (
            <>
              <Lbl>Nechta jo'natasiz</Lbl>
              <div style={{ display:"flex", gap:8 }}>
                <div style={{ flex:1 }}><NumInp value={qty} onChange={setQty} placeholder="Masalan: 5" /></div>
                <button onClick={() => {
                  if (!productId || !qtyN || qtyN <= 0) return;
                  if (qtyN > availUnits.length) return alert(`Omborda ${availUnits.length} dona`);
                  const already = transferList.find(x => x.productId === productId);
                  if (already) {
                    setTransferList(prev => prev.map(x => x.productId === productId ? { ...x, qty: x.qty + qtyN } : x));
                  } else {
                    setTransferList(prev => [...prev, { productId, name: product?.name, qty: qtyN }]);
                  }
                  setProductId(""); setQty("");
                }} style={{ background: t.acc, color:"#fff", borderRadius:10, padding:"0 16px", fontWeight:700, fontSize:18, marginBottom:11 }}>+</button>
              </div>

              {transferList.length > 0 && (
                <div style={{ background:t.card, borderRadius:10, padding:10, marginBottom:11 }}>
                  <div style={{ fontSize:11, color:t.sub, fontWeight:700, marginBottom:8 }}>Jo'natiladiganlar:</div>
                  {transferList.map((item, i) => (
                    <div key={i} style={{ display:"flex", alignItems:"center", gap:8, padding:"6px 0", borderBottom:`1px solid ${t.border}33` }}>
                      <div style={{ flex:1 }}>
                        <div style={{ fontSize:13, fontWeight:700 }}>{item.name}</div>
                        <div style={{ fontSize:11, color:t.acc, ...s.mono }}>{item.qty} dona</div>
                      </div>
                      <button onClick={() => setTransferList(prev => prev.filter((_, j) => j !== i))} style={{ color:t.red, padding:4 }}><Ic n="trash" s={14}/></button>
                    </div>
                  ))}
                  <div style={{ marginTop:8, fontSize:12, color:t.amber }}>⚠️ Jami: {transferList.reduce((s,x)=>s+x.qty,0)} dona</div>
                </div>
              )}

              <Btn bg={t.acc} onClick={send} disabled={(transferList.length === 0 && (!product || !qtyN)) || saving}>
                {saving ? "Jo'natilmoqda..." : transferList.length > 0 ? `✓ Jo'natish (${transferList.reduce((s,x)=>s+x.qty,0)} dona)` : "✓ Jo'natish"}
              </Btn>
            </>
          ) : (
            <>
              <Lbl>Scanner yoki qo'lda ID yozing</Lbl>
              <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                <input
                  style={{ ...s.inp, marginBottom: 0, flex: 1 }}
                  placeholder="JS-001-#0001"
                  value={scanInput}
                  onChange={e => handleScanInput(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && addScannedId()}
                  autoFocus
                />
                <button onClick={addScannedId} style={{ background: t.acc, color: "#fff", borderRadius: 10, padding: "0 16px", fontWeight: 700, fontSize: 18 }}>+</button>
              </div>
              {scanErr && <div style={{ color: t.red, fontSize: 12, marginBottom: 8 }}>{scanErr}</div>}
              {scannedIds.length > 0 && (
                <div style={{ background: t.card, borderRadius: 10, padding: 10, marginBottom: 11, maxHeight: 150, overflowY: "auto" }}>
                  <div style={{ ...s.row, marginBottom: 6 }}>
                    <span style={{ fontSize: 11, color: t.sub, fontWeight: 700 }}>Skanerlangan: {scannedIds.length} dona</span>
                    <button onClick={() => setScannedIds([])} style={{ fontSize: 10, color: t.red }}>Tozalash</button>
                  </div>
                  {scannedIds.map(u => (
                    <div key={u.id} style={{ ...s.row, padding: "4px 0", fontSize: 11, borderBottom: `1px solid ${t.border}33` }}>
                      <span style={{ ...s.mono, color: t.acc, fontWeight: 700 }}>{u.unitId}</span>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <span style={{ color: t.sub }}>{u.prodName}</span>
                        <button onClick={() => setScannedIds(prev => prev.filter(x => x.id !== u.id))} style={{ color: t.red, fontSize: 12 }}>✕</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
              <Btn bg={t.acc} onClick={send} disabled={scannedIds.length === 0 || saving}>{saving ? "Jo'natilmoqda..." : `✓ Jo'natish (${scannedIds.length} dona)`}</Btn>
            </>
          )}
        </div>
      </div>
    );
  };

  // ═══════════════════════════════════════════════════════════
  // MODAL: SELL
  // ═══════════════════════════════════════════════════════════
  const SellModal = () => {
    const [storeId, setStoreId] = useState(sel?.storeId || "");
    const [productId, setProductId] = useState(sel?.productId || "");
    const [qty, setQty] = useState(1);
    const [discount, setDiscount] = useState("");
    const [customerId, setCustomerId] = useState("");
    const [customerName, setCustomerName] = useState("");
    const [customerPhone, setCustomerPhone] = useState("");
    const [isPaid, setIsPaid] = useState(true);
    const [payMethod, setPayMethod] = useState("cash");
    const [date, setDate] = useState(today());
    const [debtDue, setDebtDue] = useState("");
    const [saving, setSaving] = useState(false);

    const storeProds = useMemo(() => {
      const byP = getStoreUnitsByProduct(storeId);
      return Object.entries(byP).map(([pid, us]) => ({ product: products.find(p => p.id === pid), units: us })).filter(x => x.product);
    }, [storeId, units]);

    const availUnits = productId && storeId ? getStoreUnits(storeId, productId) : [];
    const product = products.find(p => p.id === productId);
    const qtyN = +qty || 1;
    const discN = +discount || 0;
    const total = product ? Math.round(product.price * qtyN * (1 - discN / 100) * 100) / 100 : 0;

    const sell = async () => {
      if (!storeId || !product) return alert("Tanlang");
      if (qtyN > availUnits.length) return alert(`Vitrinada ${availUnits.length} dona`);
      setSaving(true);
      const soldUnits = availUnits.slice(0, qtyN);
      const ok = await verifyUnitsUnchanged(soldUnits.map(u => u.id));
      if (!ok) { setSaving(false); return; }

      // Units sold qilish
      const updatedUnits = soldUnits.map(u => ({ ...u, unit_id: u.unitId, product_id: u.productId, added_at: u.addedAt, status: "sold" }));
      await db.from("units").upsert(updatedUnits);
      setUnits(prev => prev.map(u => soldUnits.find(x => x.id === u.id) ? { ...u, status: "sold" } : u));

      // Customer
      let finalCustomerId = customerId, finalCustomerName = customerName;
      if (!customerId && customerName.trim()) {
        const newC = { id: uid(), name: customerName.trim(), phone: customerPhone.trim(), created_at: now() };
        await db.from("customers").insert(newC);
        setCustomers(prev => [newC, ...prev]);
        finalCustomerId = newC.id;
      } else if (customerId) {
        finalCustomerName = customers.find(c => c.id === customerId)?.name || "";
      }

      const sale = {
        id: uid(),
        unit_ids: soldUnits.map(u => u.unitId),
        store_id: storeId, product_id: productId,
        customer_id: finalCustomerId || null, customer_name: finalCustomerName || "",
        qty: qtyN, price: total / qtyN, cost: product.cost, total_amount: total,
        paid: isPaid, pay_date: isPaid ? date : null, pay_method: isPaid ? payMethod : null,
        debt_due: !isPaid && debtDue ? debtDue : null,
        partial_payments: [], date, created_at: now(),
      };
      await db.from("sales").insert(sale);
      setSales(prev => [{ ...sale, unitIds: sale.unit_ids, storeId: sale.store_id, productId: sale.product_id, customerId: sale.customer_id, customerName: sale.customer_name, totalAmount: sale.total_amount, payDate: sale.pay_date, payMethod: sale.pay_method, partialPayments: [] }, ...prev]);

      const store = stores.find(s => s.id === storeId);
      await log("Sotildi", `${product.name} ${qtyN} dona — ${store.name} = ${fmt(total)}${!isPaid ? ' [QARZ]' : ''}`);
      setSaving(false);
      setModal(null); setSel(null);
    };

    return (
      <div style={s.overlay} onClick={() => { setModal(null); setSel(null); }}>
        <div style={s.sheet} onClick={e => e.stopPropagation()} className="up">
          <div style={{ ...s.row, marginBottom: 16 }}>
            <span style={{ fontSize: 17, fontWeight: 800 }}>💵 Sotuv yozish</span>
            <button style={s.iBtn} onClick={() => { setModal(null); setSel(null); }}><Ic n="x" s={16} /></button>
          </div>
          <Lbl>Do'kon</Lbl>
          <select style={s.inp} value={storeId} onChange={e => { setStoreId(e.target.value); setProductId(""); }}>
            <option value="">— tanlang —</option>
            {stores.map(st => <option key={st.id} value={st.id}>{st.name}</option>)}
          </select>
          {storeId && (
            <>
              <Lbl>Mahsulot</Lbl>
              <select style={s.inp} value={productId} onChange={e => setProductId(e.target.value)}>
                <option value="">— tanlang —</option>
                {storeProds.map(({ product: p, units: us }) => <option key={p.id} value={p.id}>{p.name} ({us.length} dona)</option>)}
              </select>
              {storeProds.length === 0 && <div style={{ background: t.amberS, borderRadius: 9, padding: 10, marginBottom: 11, fontSize: 12, color: t.amber }}>⚠️ Vitrinada yo'q.</div>}
            </>
          )}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>
            <div><Lbl>Soni</Lbl><NumInp value={qty} onChange={setQty} placeholder="1" /></div>
            <div><Lbl>Chegirma %</Lbl><NumInp value={discount} onChange={setDiscount} placeholder="0" /></div>
          </div>
          <Lbl>Mijoz</Lbl>
          {customers.length > 0 && (
            <select style={s.inp} value={customerId} onChange={e => { setCustomerId(e.target.value); if (e.target.value) setCustomerName(""); }}>
              <option value="">— yangi —</option>
              {customers.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          )}
          {!customerId && (
            <div>
              <input style={s.inp} placeholder="Yangi mijoz ismi *" value={customerName} onChange={e => setCustomerName(e.target.value)} />
              <input style={s.inp} placeholder="Telefon: +998901234567" value={customerPhone} onChange={e => setCustomerPhone(e.target.value)} />
            </div>
          )}
          <Lbl>Sana</Lbl>
          <input type="date" style={s.inp} value={date} onChange={e => setDate(e.target.value)} />
          <div style={{ background: t.card, border: `1px solid ${t.border}`, borderRadius: 11, padding: 12, marginBottom: 11 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: t.sub, marginBottom: 10, textTransform: "uppercase" }}>To'lov holati</div>
            <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
              <button onClick={() => setIsPaid(true)} style={{ flex: 1, padding: "10px", borderRadius: 9, background: isPaid ? t.green : t.card, border: `1.5px solid ${isPaid ? t.green : t.border}`, color: isPaid ? "#fff" : t.sub, fontWeight: 700, fontSize: 13 }}>✓ To'landi</button>
              <button onClick={() => setIsPaid(false)} style={{ flex: 1, padding: "10px", borderRadius: 9, background: !isPaid ? t.red : t.card, border: `1.5px solid ${!isPaid ? t.red : t.border}`, color: !isPaid ? "#fff" : t.sub, fontWeight: 700, fontSize: 13 }}>📝 Qarzga</button>
            </div>
            {isPaid && <select style={{ ...s.inp, marginBottom: 0 }} value={payMethod} onChange={e => setPayMethod(e.target.value)}>{Object.entries(PAYMENT_INFO).map(([k, v]) => <option key={k} value={k}>{v.emoji} {v.label}</option>)}</select>}
            {!isPaid && (
              <div>
                <Lbl>To'lash muddati</Lbl>
                <input type="date" style={{ ...s.inp, marginBottom: 0 }} value={debtDue} onChange={e => setDebtDue(e.target.value)} />
              </div>
            )}
          </div>
          {product && qtyN > 0 && (
            <div style={{ background: isPaid ? t.greenS : t.redS, borderRadius: 11, padding: 13, marginBottom: 11 }}>
              <div style={{ ...s.row, marginBottom: 6 }}><span style={{ fontSize: 12, color: t.sub }}>Jami</span><span style={{ ...s.mono, fontWeight: 800, color: isPaid ? t.green : t.red, fontSize: 17 }}>{fmt(total)}</span></div>
              {canSee("profit") && <div style={s.row}><span style={{ fontSize: 12, color: t.sub }}>Foyda</span><span style={{ ...s.mono, fontWeight: 700, color: t.green }}>{fmt(total - product.cost * qtyN)}</span></div>}
            </div>
          )}
          <Btn bg={isPaid ? t.green : t.amber} onClick={sell} disabled={!product || saving}>{saving ? "Saqlanmoqda..." : isPaid ? "✓ Tasdiqlash" : "📝 Qarzga"}</Btn>
        </div>
      </div>
    );
  };

  // ═══════════════════════════════════════════════════════════
  // MODAL: PAY
  // ═══════════════════════════════════════════════════════════
  const PayModal = () => {
    const sale = sales.find(x => x.id === sel?.saleId);
    if (!sale) return null;
    const pp = (sale.partialPayments || []).reduce((sum, p) => sum + p.amount, 0);
    const remaining = sale.totalAmount - pp;
    const [amount, setAmount] = useState(remaining);
    const [method, setMethod] = useState("cash");
    const [date, setDate] = useState(today());
    const [saving, setSaving] = useState(false);

    const conf = async () => {
      const amt = +amount;
      if (!amt || amt <= 0) return alert("Summa");
      if (amt > remaining) return alert(`Qolgan: ${fmt(remaining)}`);
      setSaving(true);
      const isFull = amt >= remaining;
      const payment = { id: uid(), amount: amt, method, date };
      const newPartials = [...(sale.partialPayments || []), payment];
      const updated = {
        ...sale,
        unit_ids: sale.unitIds,
        store_id: sale.storeId, product_id: sale.productId,
        customer_id: sale.customerId, customer_name: sale.customerName,
        total_amount: sale.totalAmount, pay_date: isFull ? date : sale.payDate,
        pay_method: isFull ? method : sale.payMethod,
        partial_payments: newPartials, paid: isFull,
      };
      await db.from("sales").upsert(updated);
      setSales(prev => prev.map(x => x.id === sale.id ? { ...x, partialPayments: newPartials, paid: isFull, payDate: isFull ? date : x.payDate, payMethod: isFull ? method : x.payMethod } : x));
      await log("Pul olindi", `${sale.customerName || 'Mijoz'} — ${fmt(amt)}`);
      setSaving(false);
      setModal(null); setSel(null);
    };

    return (
      <div style={s.overlay} onClick={() => { setModal(null); setSel(null); }}>
        <div style={s.sheet} onClick={e => e.stopPropagation()} className="up">
          <div style={{ ...s.row, marginBottom: 16 }}>
            <span style={{ fontSize: 17, fontWeight: 800 }}>💰 Pul qabul qilish</span>
            <button style={s.iBtn} onClick={() => { setModal(null); setSel(null); }}><Ic n="x" s={16} /></button>
          </div>
          <div style={{ background: t.card, borderRadius: 12, padding: 14, marginBottom: 14 }}>
            <div style={{ ...s.row, marginBottom: 6 }}><span style={{ fontSize: 12, color: t.sub }}>Mijoz</span><span style={{ fontSize: 13, fontWeight: 700 }}>{sale.customerName || "—"}</span></div>
            <div style={{ ...s.row, marginBottom: 6 }}><span style={{ fontSize: 12, color: t.sub }}>Umumiy</span><span style={{ ...s.mono, fontWeight: 700 }}>{fmt(sale.totalAmount)}</span></div>
            {pp > 0 && <div style={{ ...s.row, marginBottom: 6 }}><span style={{ fontSize: 12, color: t.sub }}>To'langan</span><span style={{ ...s.mono, fontWeight: 700, color: t.green }}>{fmt(pp)}</span></div>}
            <Div />
            <div style={s.row}><span style={{ fontSize: 13, fontWeight: 700 }}>QOLGAN</span><span style={{ ...s.mono, fontWeight: 800, color: t.red, fontSize: 17 }}>{fmt(remaining)}</span></div>
          </div>
          <Lbl>Olingan summa</Lbl>
          <NumInp value={amount} onChange={setAmount} placeholder="0" />
          <Lbl>To'lov usuli</Lbl>
          <select style={s.inp} value={method} onChange={e => setMethod(e.target.value)}>{Object.entries(PAYMENT_INFO).map(([k, v]) => <option key={k} value={k}>{v.emoji} {v.label}</option>)}</select>
          <Lbl>Sana</Lbl>
          <input type="date" style={s.inp} value={date} onChange={e => setDate(e.target.value)} />
          <Btn bg={t.green} onClick={conf} disabled={saving}>{saving ? "Saqlanmoqda..." : `✓ Pul olindi — ${fmt(+amount || 0)}`}</Btn>
        </div>
      </div>
    );
  };

  // ═══════════════════════════════════════════════════════════
  // MODAL: RETURN
  // ═══════════════════════════════════════════════════════════
  const ReturnModal = () => {
    const store = stores.find(s => s.id === sel?.storeId);
    const product = products.find(p => p.id === sel?.productId);
    const availUnits = getStoreUnits(sel?.storeId, sel?.productId);
    const [qty, setQty] = useState(1);
    const [saving, setSaving] = useState(false);
    if (!store || !product) return null;
    const ret = async () => {
      const q = +qty || 1;
      if (q > availUnits.length) return alert(`Vitrinada ${availUnits.length} dona`);
      setSaving(true);
      const toRet = availUnits.slice(0, q);
      const ok = await verifyUnitsUnchanged(toRet.map(u => u.id));
      if (!ok) { setSaving(false); return; }
      const updates = toRet.map(u => ({ ...u, unit_id: u.unitId, product_id: u.productId, added_at: u.addedAt, location: "warehouse", sent_at: null }));
      await db.from("units").upsert(updates);
      setUnits(prev => prev.map(u => toRet.find(r => r.id === u.id) ? { ...u, location: "warehouse", sentAt: undefined } : u));
      await log("Vitrinadan qaytarildi", `${product.name} ${q} dona — ${store.name}`);
      setSaving(false);
      setModal(null); setSel(null);
    };
    return (
      <div style={s.overlay} onClick={() => { setModal(null); setSel(null); }}>
        <div style={s.sheet} onClick={e => e.stopPropagation()} className="up">
          <div style={{ ...s.row, marginBottom: 16 }}>
            <span style={{ fontSize: 17, fontWeight: 800 }}>↩️ Qaytarish</span>
            <button style={s.iBtn} onClick={() => { setModal(null); setSel(null); }}><Ic n="x" s={16} /></button>
          </div>
          <div style={{ background: t.amberS, borderRadius: 11, padding: 12, marginBottom: 14, fontSize: 12, color: t.amber }}><b>{product.name}</b><br />{store.name} → omborga</div>
          <Lbl>Nechta (mavjud: {availUnits.length})</Lbl>
          <NumInp value={qty} onChange={setQty} placeholder="1" />
          <Btn bg={t.amber} onClick={ret} disabled={saving}>{saving ? "Qaytarilmoqda..." : "✓ Qaytarish"}</Btn>
        </div>
      </div>
    );
  };

  // ═══════════════════════════════════════════════════════════
  // MODAL: ORDER
  // ═══════════════════════════════════════════════════════════
  const OrderModal = () => {
    const existing = sel?.editOrder;
    const [f, setF] = useState(existing || { storeId: stores[0]?.id || "", productId: "", qty: 1, note: "", deadline: "", price: "", prepaid: "", status: "pending" });
    const [saving, setSaving] = useState(false);
    const product = products.find(p => p.id === f.productId);
    const orderNumber = existing?.orderId || `ZK-${pad4(orders.length + 1)}`;

    const save = async () => {
      if (!f.storeId || !f.productId) return alert("Tanlang");
      if (!f.deadline) return alert("Srok");
      setSaving(true);
      if (existing) {
        const updated = { ...existing, ...f, store_id: f.storeId, product_id: f.productId, order_id: existing.orderId, status_history: existing.statusHistory || [] };
        await db.from("orders").upsert(updated);
        setOrders(prev => prev.map(o => o.id === existing.id ? { ...o, ...f } : o));
        await log("Zakaz tahrirlandi", existing.orderId);
      } else {
        const newOrder = {
          id: uid(), order_id: orderNumber,
          store_id: f.storeId, product_id: f.productId,
          qty: +f.qty || 1, note: f.note, deadline: f.deadline,
          price: +f.price || 0, prepaid: +f.prepaid || 0,
          status: "pending", status_history: [{ status: "pending", time: now() }],
          created_at: now(),
        };
        await db.from("orders").insert(newOrder);
        setOrders(prev => [{ ...newOrder, orderId: newOrder.order_id, storeId: newOrder.store_id, productId: newOrder.product_id, statusHistory: newOrder.status_history }, ...prev]);
        await log("Zakaz qo'shildi", `${orderNumber} — ${product?.name}`);
      }
      setSaving(false);
      setModal(null); setSel(null);
    };

    return (
      <div style={s.overlay} onClick={() => { setModal(null); setSel(null); }}>
        <div style={s.sheet} onClick={e => e.stopPropagation()} className="up">
          <div style={{ ...s.row, marginBottom: 16 }}>
            <span style={{ fontSize: 17, fontWeight: 800 }}>{existing ? "Zakazni tahrirlash" : "Yangi zakaz"}</span>
            <button style={s.iBtn} onClick={() => { setModal(null); setSel(null); }}><Ic n="x" s={16} /></button>
          </div>
          <div style={{ background: t.accSoft, borderRadius: 10, padding: "10px 12px", marginBottom: 14 }}>
            <div style={{ fontSize: 11, color: t.sub }}>Zakaz ID</div>
            <div style={{ ...s.mono, fontWeight: 800, color: t.acc, fontSize: 16 }}>{orderNumber}</div>
          </div>
          <Lbl>Qaysi do'kondan</Lbl>
          <select style={s.inp} value={f.storeId} onChange={e => setF(p => ({ ...p, storeId: e.target.value }))}>
            <option value="">— tanlang —</option>
            {stores.map(st => <option key={st.id} value={st.id}>{st.name}</option>)}
          </select>
          <Lbl>Qaysi modelga o'xshash</Lbl>
          <select style={s.inp} value={f.productId} onChange={e => setF(p => ({ ...p, productId: e.target.value }))}>
            <option value="">— tanlang —</option>
            {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>
            <div><Lbl>Soni</Lbl><NumInp value={f.qty} onChange={v => setF(p => ({ ...p, qty: v }))} placeholder="1" /></div>
            <div><Lbl>Srok</Lbl><input type="date" style={s.inp} value={f.deadline} onChange={e => setF(p => ({ ...p, deadline: e.target.value }))} /></div>
          </div>
          <Lbl>Izoh</Lbl>
          <textarea style={{ ...s.inp, minHeight: 70, resize: "vertical" }} placeholder="Masalan: qora rangda..." value={f.note} onChange={e => setF(p => ({ ...p, note: e.target.value }))} />
          <Lbl>Kelishilgan narx ($)</Lbl>
          <NumInp value={f.price} onChange={v => setF(p => ({ ...p, price: v }))} placeholder="0" />
          <Lbl>Oldindan olingan ($)</Lbl>
          <NumInp value={f.prepaid} onChange={v => setF(p => ({ ...p, prepaid: v }))} placeholder="0" />
          {existing && (
            <>
              <Lbl>Status</Lbl>
              <select style={s.inp} value={f.status} onChange={e => setF(p => ({ ...p, status: e.target.value }))}>{Object.entries(ORDER_STATUS).map(([k, v]) => <option key={k} value={k}>{v.emoji} {v.label}</option>)}</select>
            </>
          )}
          <Btn bg={t.acc} onClick={save} disabled={saving}>{saving ? "Saqlanmoqda..." : existing ? "Saqlash" : "Zakaz qo'shish"}</Btn>
        </div>
      </div>
    );
  };

  // ═══════════════════════════════════════════════════════════
  // PAGE: HOME
  // ═══════════════════════════════════════════════════════════
  const HomePage = () => {
    if (products.length === 0 && stores.length === 0) {
      return (
        <div className="fade">
          <div style={{ marginBottom: 20 }}>
            <div style={{ fontSize: 12, color: t.sub }}>Xush kelibsiz 👋</div>
            <div style={{ fontSize: 22, fontWeight: 800 }}>Mebel ERP</div>
          </div>
          <Empty icon="warehouse" title="Boshlash uchun" desc={"1️⃣ Mahsulot qo'shing\n2️⃣ Do'kon qo'shing\n3️⃣ Vitrinaga jo'nating\n4️⃣ Sotuv yozing"} btnText="Mahsulot qo'shish" onBtn={() => setModal("product")} />
        </div>
      );
    }
    const urgent = orders.filter(o => o.status !== "delivered" && o.deadline && daysLeft(o.deadline) <= 3).length;
    const topProducts = (() => {
      const map = {};
      sales.forEach(s => {
        if (!map[s.productId]) map[s.productId] = 0;
        map[s.productId] += (s.price - s.cost) * s.qty;
      });
      return Object.entries(map).map(([pid, prof]) => ({ product: products.find(p => p.id === pid), profit: prof })).filter(x => x.product).sort((a, b) => b.profit - a.profit).slice(0, 3);
    })();
    return (
      <div className="fade">
        <div style={{ ...s.row, marginBottom: 16 }}>
          <div>
            <div style={{ fontSize: 12, color: t.sub }}>Dashboard</div>
            <div style={{ fontSize: 22, fontWeight: 800 }}>Umumiy holat</div>
          </div>
          <button onClick={pdfHome} disabled={pdfLoading === "home"} style={{ ...s.iBtn, color: t.acc }} title="PDF"><Ic n={pdfLoading === "home" ? "refresh" : "pdf"} s={16} /></button>
        </div>
        {urgent > 0 && (
          <div onClick={() => setTab("orders")} style={{ background: t.redS, border: `1px solid ${t.red}33`, borderRadius: 12, padding: "12px 14px", marginBottom: 10, display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
            <div style={{ color: t.red }}><Ic n="alert" s={18} /></div>
            <div style={{ flex: 1, fontSize: 13, color: t.red, fontWeight: 700 }}>⚠️ {urgent} ta zakaz sroki yaqin!</div>
            <Ic n="right" s={16} />
          </div>
        )}
        {stats.debtCount > 0 && (() => {

            if (!s.payDate) return false;

            <div onClick={() => setTab("debts")} style={{ background: t.amberS, border: `1px solid ${t.amber}33`, borderRadius: 12, padding: "12px 14px", marginBottom: 10, display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
              <div style={{ color: t.amber }}><Ic n="debt" s={18} /></div>
              <div style={{ flex: 1, fontSize: 13, color: t.amber, fontWeight: 700 }}>💰 {overdueDebts.length} ta qarz muddati o'tdi!</div>
              <Ic n="right" s={16} />
            </div>
          ) : null;

          <div style={{ background: t.accSoft, border: `1px solid ${t.acc}22`, borderRadius: 13, padding: 14 }}>
            <div style={{ fontSize: 26, color: t.acc, ...s.numXl }}>{fmtK(stats.totalSales)}</div>
            <div style={{ fontSize: 11, color: t.sub, marginTop: 5 }}>Umumiy sotuv</div>
          </div>
          <div style={{ background: t.greenS, border: `1px solid ${t.green}22`, borderRadius: 13, padding: 14 }}>
            <div style={{ fontSize: 26, color: t.green, ...s.numXl }}>{fmtK(stats.totalProfit)}</div>
            <div style={{ fontSize: 11, color: t.sub, marginTop: 5 }}>Foyda</div>
          </div>
          <div style={{ background: t.blueS, border: `1px solid ${t.blue}22`, borderRadius: 13, padding: 14 }}>
            <div style={{ fontSize: 26, color: t.blue, ...s.numXl }}>{fmtK(stats.totalPaid)}</div>
            <div style={{ fontSize: 11, color: t.sub, marginTop: 5 }}>Kassada</div>
          </div>
          <div style={{ background: t.redS, border: `1px solid ${t.red}22`, borderRadius: 13, padding: 14 }}>
            <div style={{ fontSize: 26, color: t.red, ...s.numXl }}>{fmtK(stats.totalCustomerDebt)}</div>
            <div style={{ fontSize: 11, color: t.sub, marginTop: 5 }}>Mijoz qarzi</div>
          </div>

    const sUnits = units.filter(u => u.location === store.id && u.status === "available");
    const unitsByProd = {};
    sUnits.forEach(u => {
      if (!unitsByProd[u.productId]) unitsByProd[u.productId] = [];
      unitsByProd[u.productId].push(u);
    });
    const sSales = sales.filter(s => s.storeId === store.id).sort((a, b) => b.date.localeCompare(a.date));
    const sOrders = orders.filter(o => o.storeId === store.id);
    const allPayments = [];
    sSales.forEach(s => {
      if (s.paid && s.payDate) allPayments.push({ id: s.id + "-full", saleId: s.id, amount: s.totalAmount, method: s.payMethod, date: s.payDate, customerName: s.customerName, productId: s.productId });
      (s.partialPayments || []).forEach(p => allPayments.push({ id: p.id, saleId: s.id, amount: p.amount, method: p.method, date: p.date, customerName: s.customerName, productId: s.productId }));
    });
    allPayments.sort((a, b) => b.date.localeCompare(a.date));
    const sDebt = sUnits.reduce((sum, u) => sum + (products.find(p => p.id === u.productId)?.price || 0), 0);
    const totalRev = sSales.reduce((sum, s) => sum + s.totalAmount, 0);
    const totalPaidStore = allPayments.reduce((sum, p) => sum + p.amount, 0);
    const custDebt = sSales.reduce((sum, s) => {
      if (s.paid) return sum;
      const pp = (s.partialPayments || []).reduce((a, p) => a + p.amount, 0);

    });
    return (
      <div className="fade">
        <div style={{ ...s.row, marginBottom: 14 }}>
          <div>
            <div style={{ fontSize: 22, fontWeight: 800 }}>📋 Zakazlar</div>

          const isUrg = dl !== null && dl <= 3 && o.status !== "delivered";
          return (

              <div style={s.row}>
                <div style={{ flex: 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                    <span style={{ ...s.mono, fontSize: 13, color: t.acc, fontWeight: 800 }}>{o.orderId}</span>
                    <Badge c={t[stInfo.color]} bg={t[stInfo.color + "S"]}>{stInfo.emoji} {stInfo.label}</Badge>
                  </div>
                  <div style={{ fontSize: 14, fontWeight: 700 }}>{prod?.name} × {o.qty}</div>
                  <div style={{ fontSize: 11, color: t.sub, marginTop: 2 }}>🏪 {store?.name}</div>

                </div>
                <button onClick={() => askConfirm("Zakazni o'chirish", `${o.orderId} o'chirilsinmi?`, async () => {
                  await db.from("orders").delete().eq("id", o.id);
                  setOrders(prev => prev.filter(x => x.id !== o.id));
                  await log("Zakaz o'chirildi", o.orderId);
                }, true)} style={{ background: t.redS, color: t.red, borderRadius: 8, padding: "6px 8px" }}><Ic n="trash" s={13} /></button>
              </div>
              <Div />
              <div style={{ ...s.row, fontSize: 11 }}>
                <div style={{ color: isUrg ? t.red : t.sub, fontWeight: 700 }}>📅 {dateStr(o.deadline)}{dl !== null && <span> ({dl < 0 ? `${Math.abs(dl)} kun kechikdi!` : dl === 0 ? "BUGUN!" : `${dl} kun qoldi`})</span>}</div>
                <div style={{ ...s.mono, color: t.sub }}>{fmtK(o.prepaid)}/{fmtK(o.price)}</div>
              </div>
              <div style={{ display: "flex", gap: 6, marginTop: 10 }}>
                <button onClick={() => { setSel({ editOrder: o }); setModal("order"); }} style={{ flex: 1, background: t.accSoft, color: t.acc, borderRadius: 8, padding: "8px", fontSize: 12, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", gap: 4 }}><Ic n="edit" s={13} /> Tahrirlash</button>

                  <select value={o.status} onChange={async e => {
                    const ns = e.target.value;
                    const newHistory = [...(o.statusHistory || []), { status: ns, time: now() }];
                    await db.from("orders").update({ status: ns, status_history: newHistory }).eq("id", o.id);
                    setOrders(prev => prev.map(x => x.id === o.id ? { ...x, status: ns, statusHistory: newHistory } : x));

                    {Object.entries(ORDER_STATUS).map(([k, v]) => <option key={k} value={k}>{v.emoji} {v.label}</option>)}
                  </select>
                )}
              </div>
            </div>
          );
        })}
      </div>
    );

  // ═══════════════════════════════════════════════════════════
  // PAGE: REPORT
  // ═══════════════════════════════════════════════════════════
  const ReportPage = () => {
    const thisMonth = new Date().toISOString().slice(0, 7);
    const monthSales = sales.filter(s => s.date.startsWith(thisMonth));
    const monthRev = monthSales.reduce((sum, s) => sum + s.totalAmount, 0);
    const monthProfit = monthSales.reduce((sum, s) => sum + (s.price - s.cost) * s.qty, 0);
    const productSales = {};
    sales.forEach(s => {
      if (!productSales[s.productId]) productSales[s.productId] = { qty: 0, profit: 0 };
      productSales[s.productId].qty += s.qty;
      productSales[s.productId].profit += (s.price - s.cost) * s.qty;
    });
    const topProds = Object.entries(productSales).map(([pid, st]) => ({ product: products.find(p => p.id === pid), ...st })).filter(x => x.product).sort((a, b) => b.profit - a.profit).slice(0, 5);
    return (
      <div className="fade">
        <div style={{ ...s.row, marginBottom: 16 }}>
          <div>
            <div style={{ fontSize: 22, fontWeight: 800 }}>📊 Hisobot</div>
            <div style={{ fontSize: 12, color: t.sub, marginTop: 2 }}>Umumiy biznes holati</div>
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={loadAll} style={{ ...s.iBtn, color: t.acc }} title="Yangilash"><Ic n="refresh" s={16} /></button>
            <button onClick={pdfReport} disabled={pdfLoading === "report"} style={{ ...s.iBtn, color: t.acc }} title="PDF"><Ic n={pdfLoading === "report" ? "refresh" : "pdf"} s={16} /></button>
            <button onClick={() => {
              const rows = [["Sana","Mahsulot","Dokon","Mijoz","Soni","Narx","Jami","Tolangan","Qarz"]];
              sales.forEach(s => {
                const prod = products.find(p => p.id === s.productId);
                const store = stores.find(st => st.id === s.storeId);
                const pp = (s.partialPayments||[]).reduce((a,p)=>a+p.amount,0);
                rows.push([dateStr(s.date),prod?.name||"",store?.name||"",s.customerName||"",s.qty,s.price,s.totalAmount,s.paid?s.totalAmount:pp,s.paid?0:s.totalAmount-pp]);
              });
              const csv = rows.map(r=>r.join(",")).join(String.fromCharCode(10));
              const blob = new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
              const a = document.createElement("a");
              a.href = URL.createObjectURL(blob);
              a.download = "kabir-erp-sotuv-"+today()+".csv";
              a.click();
            }} style={{ ...s.iBtn, color: t.green }} title="Excel yuklash">📥</button>
            <button onClick={() => {
              const data = { products, units, stores, sales, orders, customers, exportDate: now() };
              const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
              const a = document.createElement("a");
              a.href = URL.createObjectURL(blob);
              a.download = "kabir-erp-backup-"+today()+".json";
              a.click();
            }} style={{ ...s.iBtn, color: t.amber }} title="Backup">💾</button>
          </div>
        </div>
        <Sec mt={4}>Bu oy</Sec>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>
          <div style={{ background: t.accSoft, borderRadius: 12, padding: 13 }}>
            <div style={{ fontSize: 18, fontWeight: 800, color: t.acc, ...s.mono }}>{fmtK(monthRev)}</div>
            <div style={{ fontSize: 11, color: t.sub, marginTop: 4 }}>Sotuv</div>

          <div style={{ background: t.greenS, borderRadius: 12, padding: 13 }}>
            <div style={{ fontSize: 18, fontWeight: 800, color: t.green, ...s.mono }}>{fmtK(monthProfit)}</div>
            <div style={{ fontSize: 11, color: t.sub, marginTop: 4 }}>Foyda</div>
          </div>

          <div style={{ ...s.row, marginBottom: 8 }}><span style={{ fontSize: 13, color: t.sub }}>Jami sotuv</span><span style={{ ...s.mono, fontWeight: 700 }}>{fmt(stats.totalSales)}</span></div>
          <div style={{ ...s.row, marginBottom: 8 }}><span style={{ fontSize: 13, color: t.sub }}>Jami foyda</span><span style={{ ...s.mono, fontWeight: 700, color: t.green }}>{fmt(stats.totalProfit)}</span></div>
