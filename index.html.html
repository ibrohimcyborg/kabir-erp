  if (!n) return "$0";
  const num = Math.abs(n);
  if (num >= 1e6) return "$" + (n / 1e6).toFixed(1) + "M";
  if (num >= 1e3) return "$" + (n / 1e3).toFixed(1) + "K";
  return "$" + (Math.round(n * 100) / 100);
};

  });

    if (!loginU || !loginP) { setLoginErr("To'ldiring"); return; }
    setLoginLoading(true);
    const { data } = await db.from("users").select("*").eq("username", loginU).eq("password", loginP).single();
    setLoginLoading(false);
    if (data) {
      setUser(data);
      localStorage.setItem("kabir_user", JSON.stringify(data));
      setLoginErr("");
    }
    else setLoginErr("Login yoki parol xato!");
  };

    if (!user) return false;
    if (user.role === "superadmin") return true;
    if (user.role === "admin") { if (field === "users" || field === "price") return false; return true; }

  };

  const [stores, setStores] = useState([]);
  const [sales, setSales] = useState([]);
  const [orders, setOrders] = useState([]);
  const [customers, setCustomers] = useState([]);
  const [activity, setActivity] = useState([]);

  const t = dark ? THEMES.dark : THEMES.light;

  // ═══════════════════════════════════════════════════════════

    setLoading(true);

        db.from("products").select("*").order("created_at", { ascending: false }),

        db.from("stores").select("*").order("created_at", { ascending: false }),
        db.from("sales").select("*").order("created_at", { ascending: false }),
        db.from("orders").select("*").order("created_at", { ascending: false }),
        db.from("customers").select("*").order("created_at", { ascending: false }),
        db.from("activity").select("*").order("time", { ascending: false }).limit(200),
      ]);
      if (p.data) setProducts(p.data.map(x => ({ ...x, costItems: x.cost_items || [] })));
      if (u.data) setUnits(u.data.map(x => ({ ...x, unitId: x.unit_id, productId: x.product_id, addedAt: x.added_at, sentAt: x.sent_at })));
      if (st.data) setStores(st.data);
      if (sa.data) setSales(sa.data.map(x => ({ ...x, unitIds: x.unit_ids || [], storeId: x.store_id, productId: x.product_id, customerId: x.customer_id, customerName: x.customer_name, totalAmount: x.total_amount, payDate: x.pay_date, payMethod: x.pay_method, partialPayments: x.partial_payments || [] })));
      if (o.data) setOrders(o.data.map(x => ({ ...x, orderId: x.order_id, storeId: x.store_id, productId: x.product_id, statusHistory: x.status_history || [] })));

      if (a.data) setActivity(a.data);
    } catch (e) { console.error(e); }
    setLoading(false);

    setSyncing(true);
    try {
      await db.from(table).upsert(data);
    } catch (e) { console.error(e); }
    setSyncing(false);
  };

  const dbDelete = async (table, id) => {
    setSyncing(true);
    try { await db.from(table).delete().eq("id", id); } catch (e) { console.error(e); }
    setSyncing(false);
  };

  const dbDeleteMany = async (table, ids) => {
    setSyncing(true);
    try { await db.from(table).delete().in("id", ids); } catch (e) { console.error(e); }
    setSyncing(false);
  };

    const r = {};
    units.filter(u => u.location === sid && u.status === "available").forEach(u => {

    const totalSales = sales.reduce((s, x) => s + x.totalAmount, 0);

    const totalPaid = sales.reduce((s, x) => {
      const pp = (x.partialPayments || []).reduce((a, p) => a + p.amount, 0);
      return s + (x.paid ? x.totalAmount : pp);
    }, 0);
    const totalCustomerDebt = sales.reduce((s, x) => {
      if (x.paid) return s;
      const pp = (x.partialPayments || []).reduce((a, p) => a + p.amount, 0);
      return s + (x.totalAmount - pp);
    }, 0);
    let totalVitrinaDebt = 0;
    units.filter(u => u.location !== "warehouse" && u.status === "available").forEach(u => {
      const p = products.find(x => x.id === u.productId);
      if (p) totalVitrinaDebt += p.price;
    });
    const debtCount = sales.filter(x => !x.paid).length;
    return { totalSales, totalProfit, totalPaid, totalCustomerDebt, totalVitrinaDebt, debtCount };

  const css = `@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body,html{font-family:'Sora',system-ui,sans-serif;background:${t.bg}}input,select,textarea,button{font-family:inherit;outline:none}button{cursor:pointer;border:none;background:none}input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}input[type=number]{-moz-appearance:textfield}::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:${t.border};border-radius:3px}@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}.up{animation:up .3s cubic-bezier(.16,1,.3,1) forwards}.fade{animation:fade .2s ease}.press{transition:transform .12s}.press:active{transform:scale(.97)}.spin{animation:spin 1s linear infinite}`;

  if (!user) {

          <input type="password" style={{ width: "100%", background: "#181824", border: "1px solid #22223A", borderRadius: 11, padding: "13px 15px", color: "#EEEEF8", fontSize: 15, marginBottom: loginErr ? 8 : 16, display: "block" }} placeholder="Parol" value={loginP} onChange={e => setLoginP(e.target.value)} onKeyDown={e => e.key === "Enter" && doLogin()} />

  // ═══════════════════════════════════════════════════════════

  const ProductModal = () => {
    const existing = sel?.editProduct;
    const [f, setF] = useState(existing || { name: "", sku: "", category: CATEGORIES[0], dimensions: "", initialStock: "", markup: "", salePrice: "", costItems: [], image: "" });
    const [cName, setCName] = useState("");
    const [cAmt, setCAmt] = useState("");
    const [saving, setSaving] = useState(false);
    const [editingCostId, setEditingCostId] = useState(null);
    const [editCostName, setEditCostName] = useState("");
    const [editCostAmt, setEditCostAmt] = useState("");

    const totalCost = f.costItems.reduce((sum, x) => sum + (+x.amount || 0), 0);
    const markupN = +f.markup || 0;
    const price = +f.salePrice || 0;
    const profit = price - totalCost;
    const profitPct = totalCost > 0 ? Math.round((profit / totalCost) * 100) : 0;

    const onMarkupChange = (v) => {
      if (v === "" || v === null) { setF(p => ({ ...p, markup: "" })); return; }
      const newPrice = totalCost > 0 ? Math.round(totalCost * (1 + (+v) / 100) * 100) / 100 : "";
      setF(p => ({ ...p, markup: v, salePrice: newPrice }));
    };
    const onPriceChange = (v) => {
      if (v === "" || v === null) { setF(p => ({ ...p, salePrice: "" })); return; }
      const newMarkup = totalCost > 0 ? Math.round(((+v - totalCost) / totalCost) * 100) : "";
      setF(p => ({ ...p, salePrice: v, markup: newMarkup }));
    };
    const addCost = () => {
      if (!cName.trim() || !cAmt) return;
      setF(p => ({ ...p, costItems: [...p.costItems, { id: uid(), name: cName.trim(), amount: +cAmt }] }));
      setCName(""); setCAmt("");
    };

    const save = async () => {
      if (!f.name || !f.sku) return alert("Nomi va SKU to'ldiring");
      if (totalCost === 0) return alert("Kamida 1 ta xarajat kiriting");
      if (!price) return alert("Sotuv narxi yoki ustamani yozing");
      setSaving(true);
      const initialStock = +f.initialStock || 0;

      const productData = {
        id: existing?.id || uid(),
        name: f.name, sku: f.sku, category: f.category,
        dimensions: f.dimensions, cost: totalCost, price, markup: markupN,
        cost_items: f.costItems,
        image: f.image || "",
        created_at: existing?.created_at || now(),
      };

      await db.from("products").upsert(productData);

      if (existing) {
        setProducts(prev => prev.map(p => p.id === existing.id ? { ...productData, costItems: f.costItems } : p));
        await log("Mahsulot tahrirlandi", f.name);
      } else {
        setProducts(prev => [{ ...productData, costItems: f.costItems }, ...prev]);
        if (initialStock > 0) {
          const existingCount = units.filter(u => u.productId === productData.id).length;
          const newUnits = [];
          for (let i = 1; i <= initialStock; i++) {
            const u = {
              id: uid(),
              unit_id: generateUnitId(f.sku, pad4(existingCount + i)),
              product_id: productData.id,
              location: "warehouse",
              status: "available",
              added_at: now(),
            };
            newUnits.push(u);
          }
          await db.from("units").insert(newUnits);
          setUnits(prev => [...newUnits.map(u => ({ ...u, unitId: u.unit_id, productId: u.product_id, addedAt: u.added_at })), ...prev]);
          await log("Mahsulot qo'shildi", `${f.name} — ${initialStock} dona`);
        } else await log("Mahsulot qo'shildi", f.name);
      }
      setSaving(false);
      setModal(null); setSel(null);
    };

    return (
      <div style={s.overlay} onClick={() => { setModal(null); setSel(null); }}>
        <div style={s.sheet} onClick={e => e.stopPropagation()} className="up">
          <div style={{ ...s.row, marginBottom: 16 }}>
            <span style={{ fontSize: 17, fontWeight: 800 }}>{existing ? "Tahrirlash" : "Yangi mahsulot"}</span>
            <button style={s.iBtn} onClick={() => { setModal(null); setSel(null); }}><Ic n="x" s={16} /></button>
          </div>
          {/* FOTO */}
          <div style={{ marginBottom: 12 }}>
            <input type="file" accept="image/*" id="imgInput" style={{ display: "none" }} onChange={e => {
              const file = e.target.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = ev => setF(p => ({ ...p, image: ev.target.result }));
              reader.readAsDataURL(file);
            }} />
            <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
              <div onClick={() => document.getElementById("imgInput").click()} style={{ width: 72, height: 72, borderRadius: 12, background: f.image ? "transparent" : T.card, border: `2px dashed ${f.image ? T.acc : T.border}`, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", overflow: "hidden", flexShrink: 0 }}>
                {f.image ? <img src={f.image} style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <span style={{ fontSize: 28 }}>📷</span>}
              </div>
              <div>
                <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4 }}>Mahsulot rasmi</div>
                <button onClick={() => document.getElementById("imgInput").click()} style={{ background: T.accSoft, color: T.acc, borderRadius: 8, padding: "6px 12px", fontSize: 12, fontWeight: 700 }}>
                  {f.image ? "✏️ O'zgartirish" : "📷 Rasm qo'shish"}
                </button>
                {f.image && <button onClick={() => setF(p => ({ ...p, image: "" }))} style={{ background: T.redS, color: T.red, borderRadius: 8, padding: "6px 12px", fontSize: 12, fontWeight: 700, marginLeft: 6 }}>🗑️</button>}
              </div>
            </div>
          </div>
          <Lbl>Model nomi *</Lbl>
          <input style={s.inp} placeholder="Jurnal stol Classic" value={f.name} onChange={e => setF(p => ({ ...p, name: e.target.value }))} />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>
            <div><Lbl>SKU *</Lbl><input style={s.inp} placeholder="JS-001" value={f.sku} onChange={e => setF(p => ({ ...p, sku: e.target.value.toUpperCase() }))} /></div>
            <div><Lbl>Kategoriya</Lbl><select style={s.inp} value={f.category} onChange={e => setF(p => ({ ...p, category: e.target.value }))}>{CATEGORIES.map(c => <option key={c}>{c}</option>)}</select></div>
          </div>
          <Lbl>O'lchamlari</Lbl>
          <input style={s.inp} placeholder="120×60×45 sm" value={f.dimensions} onChange={e => setF(p => ({ ...p, dimensions: e.target.value }))} />
          {!existing && (
            <>
              <Lbl>Boshlang'ich son</Lbl>
              <NumInp value={f.initialStock} onChange={v => setF(p => ({ ...p, initialStock: v }))} placeholder="Masalan: 10" />
              {+f.initialStock > 0 && f.sku && (
                <div style={{ background: t.accSoft, borderRadius: 9, padding: "8px 11px", marginTop: -4, marginBottom: 11, fontSize: 11, color: t.acc }}>
                  📦 ID: <b>{f.sku}-#0001</b> → <b>{f.sku}-#{pad4(+f.initialStock)}</b>
                </div>
              )}
            </>
          )}
          <div style={{ borderTop: `2px dashed ${t.border}`, margin: "14px 0 12px", paddingTop: 14 }}>
            <div style={{ fontSize: 14, fontWeight: 800, marginBottom: 4 }}>💰 Tannarx tarkibi</div>
            <div style={{ fontSize: 12, color: t.sub, marginBottom: 14 }}>Har bir xarajatni alohida yozing</div>
            {f.costItems.map((item, i) => (
              <div key={item.id} style={{ background: t.card, border: `1px solid ${editingCostId === item.id ? t.acc : t.border}`, borderRadius: 10, padding: "9px 12px", marginBottom: 7 }}>
                {editingCostId === item.id ? (
                  <div>
                    <input style={s.inp} value={editCostName} onChange={e => setEditCostName(e.target.value)} />
                    <div style={{ display: "flex", gap: 8 }}>
                      <input type="number" inputMode="decimal" step="0.01" style={{ ...s.inp, marginBottom: 0, flex: 1 }} value={editCostAmt} onChange={e => setEditCostAmt(e.target.value)} />
                      <button onClick={() => {
                        setF(p => ({ ...p, costItems: p.costItems.map(x => x.id === item.id ? { ...x, name: editCostName, amount: +editCostAmt } : x) }));
                        setEditingCostId(null);
                      }} style={{ background: t.green, color: "#fff", borderRadius: 9, padding: "0 14px", fontWeight: 700, fontSize: 13 }}>✓</button>
                      <button onClick={() => setEditingCostId(null)} style={{ background: t.card, border: `1px solid ${t.border}`, color: t.sub, borderRadius: 9, padding: "0 12px", fontWeight: 700 }}>✕</button>
                    </div>
                  </div>
                ) : (
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <div style={{ width: 24, height: 24, borderRadius: 6, background: t.accSoft, color: t.acc, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 800 }}>{i + 1}</div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 13, fontWeight: 600 }}>{item.name}</div>
                      <div style={{ fontSize: 12, color: t.acc, fontWeight: 700, ...s.mono }}>${fmtN(item.amount)}</div>
                    </div>
                    <button style={{ color: t.acc, padding: 4 }} onClick={() => { setEditingCostId(item.id); setEditCostName(item.name); setEditCostAmt(item.amount); }}><Ic n="edit" s={15} /></button>
                    <button style={{ color: t.red, padding: 4 }} onClick={() => setF(p => ({ ...p, costItems: p.costItems.filter(x => x.id !== item.id) }))}><Ic n="trash" s={15} /></button>
                  </div>
                )}
              </div>
            ))}
            <div style={{ background: t.card, border: `1.5px dashed ${t.acc}55`, borderRadius: 11, padding: 12, marginBottom: 10 }}>
              <input style={s.inp} placeholder="Nomi: MDF / Lak / Zborka..." value={cName} onChange={e => setCName(e.target.value)} />
              <div style={{ display: "flex", gap: 8 }}>
                <input type="number" inputMode="decimal" step="0.01" style={{ ...s.inp, marginBottom: 0, flex: 1 }} placeholder="Summa ($)" value={cAmt} onChange={e => setCAmt(e.target.value)} onKeyDown={e => e.key === "Enter" && addCost()} />
                <button onClick={addCost} style={{ background: t.acc, color: "#fff", borderRadius: 10, padding: "0 16px", fontWeight: 700, fontSize: 18 }}>+</button>
              </div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 10 }}>
                {["MDF", "Lak", "Zborka", "Temir", "Yelim", "Mato", "Charm", "Shisha", "Dostavka", "Upakovka", "Ish haqi"].map(q => (
                  <button key={q} onClick={() => setCName(q)} style={{ background: cName === q ? t.acc : t.surf, color: cName === q ? "#fff" : t.sub, border: `1px solid ${cName === q ? t.acc : t.border}`, borderRadius: 14, padding: "4px 10px", fontSize: 11, fontWeight: 600 }}>{q}</button>
                ))}
              </div>
            </div>
            {totalCost > 0 && (
              <div style={{ background: t.accSoft, borderRadius: 11, padding: 12, marginBottom: 12 }}>
                <div style={s.row}><span style={{ fontSize: 12, color: t.sub }}>JAMI TANNARX</span><span style={{ ...s.mono, fontWeight: 800, color: t.acc, fontSize: 16 }}>{fmt(totalCost)}</span></div>
              </div>
            )}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>
            <div><Lbl>Ustama %</Lbl><NumInp value={f.markup} onChange={onMarkupChange} placeholder="30" /></div>
            <div><Lbl>Sotuv narxi ($)</Lbl><NumInp value={f.salePrice} onChange={onPriceChange} placeholder="60" /></div>
          </div>
          <div style={{ fontSize: 11, color: t.sub, marginTop: -4, marginBottom: 12 }}>💡 Birortasini yozsangiz, ikkinchisi avtomatik</div>
          {totalCost > 0 && price > 0 && (
            <div style={{ background: `${t.green}12`, border: `1px solid ${t.green}30`, borderRadius: 12, padding: 14, marginBottom: 12 }}>
              <div style={{ ...s.row, marginBottom: 8 }}><span style={{ fontSize: 12, color: t.sub }}>Tannarx</span><span style={{ ...s.mono, fontWeight: 700 }}>{fmt(totalCost)}</span></div>
              <div style={{ ...s.row, marginBottom: 8 }}><span style={{ fontSize: 12, color: t.sub }}>Sotuv narxi</span><span style={{ ...s.mono, fontWeight: 700, color: t.acc }}>{fmt(price)}</span></div>
              <div style={{ borderTop: `1px dashed ${t.border}`, paddingTop: 10 }}>
                <div style={{ ...s.row, marginBottom: 4 }}><span style={{ fontSize: 13, fontWeight: 700 }}>FOYDA</span><span style={{ ...s.mono, fontWeight: 800, color: t.green, fontSize: 17 }}>{fmt(profit)}</span></div>
                <div style={s.row}><span style={{ fontSize: 11, color: t.sub }}>Ustama</span><span style={{ ...s.mono, fontWeight: 700, color: profitPct >= 0 ? t.green : t.red }}>{profitPct}%</span></div>
              </div>
            </div>
          )}
          <Btn bg={t.acc} onClick={save} disabled={saving}>{saving ? "Saqlanmoqda..." : existing ? "Saqlash" : "Mahsulot qo'shish"}</Btn>
        </div>
      </div>
    );
  };

  // ═══════════════════════════════════════════════════════════
  // MODAL: ADD STOCK
  // ═══════════════════════════════════════════════════════════
  const AddStockModal = () => {
    const product = products.find(p => p.id === sel?.productId);
    const [qty, setQty] = useState("");
    const [addedDate, setAddedDate] = useState(today());
    const [location, setLocation] = useState("warehouse");
    const [saving, setSaving] = useState(false);
    if (!product) return null;
    const existingCount = units.filter(u => u.productId === product.id).length;

    const add = async () => {
      const q = +qty;
      if (!q || q <= 0) return alert("Sonini kiriting");
      setSaving(true);
      const newUnits = [];
      for (let i = 1; i <= q; i++) {
        newUnits.push({
          id: uid(),
          unit_id: generateUnitId(product.sku, pad4(existingCount + i)),
          product_id: product.id,
          location: location,
          status: "available",
          added_at: addedDate + "T00:00:00.000Z",
          sent_at: location !== "warehouse" ? addedDate + "T00:00:00.000Z" : null,
        });
      }
      await db.from("units").insert(newUnits);
      setUnits(prev => [...newUnits.map(u => ({ ...u, unitId: u.unit_id, productId: u.product_id, addedAt: u.added_at })), ...prev]);
      await log("Ombor to'ldirildi", `${product.name} — ${q} dona`);
      setSaving(false);
      setModal(null); setSel(null);
    };

    return (
      <div style={s.overlay} onClick={() => { setModal(null); setSel(null); }}>
        <div style={s.sheet} onClick={e => e.stopPropagation()} className="up">
          <div style={{ ...s.row, marginBottom: 16 }}>
            <span style={{ fontSize: 17, fontWeight: 800 }}>➕ Omborga qo'shish</span>
            <button style={s.iBtn} onClick={() => { setModal(null); setSel(null); }}><Ic n="x" s={16} /></button>
          </div>
          <div style={{ background: t.accSoft, borderRadius: 11, padding: 13, marginBottom: 14 }}>
            <div style={{ fontSize: 14, fontWeight: 700 }}>{product.name}</div>
            <div style={{ fontSize: 11, color: t.sub, ...s.mono }}>{product.sku}</div>
          </div>
          <Lbl>Qo'shilgan sana</Lbl>
          <input type="date" style={s.inp} value={addedDate} onChange={e => setAddedDate(e.target.value)} />
          <Lbl>Joylashuv</Lbl>
          <select style={s.inp} value={location} onChange={e => setLocation(e.target.value)}>
            <option value="warehouse">📦 Ombor</option>
            {stores.map(st => <option key={st.id} value={st.id}>🏪 {st.name}</option>)}
          </select>
          <Lbl>Nechta qo'shasiz</Lbl>
          <NumInp value={qty} onChange={setQty} placeholder="Masalan: 10" />
          {+qty > 0 && (
            <div style={{ background: t.card, borderRadius: 10, padding: 11, marginBottom: 11, fontSize: 12 }}>
              <div style={{ color: t.sub, marginBottom: 4 }}>Avtomatik ID:</div>
              <div style={{ ...s.mono, color: t.acc, fontWeight: 700 }}>
                {generateUnitId(product.sku, pad4(existingCount + 1))} → {generateUnitId(product.sku, pad4(existingCount + (+qty)))}
              </div>
              {location !== "warehouse" && <div style={{ marginTop: 8, padding: "7px 10px", background: t.amberS, borderRadius: 8, fontSize: 11, color: t.amber }}>⚠️ Vitrinaga to'g'ridan qo'shiladi</div>}
            </div>
          )}
          <Btn bg={t.acc} onClick={add} disabled={saving}>{saving ? "Saqlanmoqda..." : "✓ Qo'shish"}</Btn>
        </div>
      </div>
    );
  };

  // ═══════════════════════════════════════════════════════════
  // MODAL: STORE
  // ═══════════════════════════════════════════════════════════

            <span style={{ fontSize: 17, fontWeight: 800 }}>Yangi do'kon</span>

  // ═══════════════════════════════════════════════════════════
  // MODAL: TRANSFER
  // ═══════════════════════════════════════════════════════════
  const TransferModal = () => {
    const [storeId, setStoreId] = useState(sel?.storeId || stores[0]?.id || "");
    const [productId, setProductId] = useState("");
    const [qty, setQty] = useState("");
    const [sentDate, setSentDate] = useState(today());
    const [saving, setSaving] = useState(false);
    const [scanMode, setScanMode] = useState(false);
    const [scannedIds, setScannedIds] = useState([]);
    const [scanInput, setScanInput] = useState("");
    const [scanErr, setScanErr] = useState("");

    const handleScanInput = (val) => {
      setScanInput(val);
      setScanErr("");
    };

    const addScannedId = () => {
      const trimmed = scanInput.trim();
      if (!trimmed) return;
      const unit = units.find(u => u.unitId === trimmed && u.location === "warehouse" && u.status === "available");
      if (!unit) { setScanErr(`❌ ${trimmed} — omborda yo'q!`); return; }
      if (scannedIds.find(s => s.unitId === trimmed)) { setScanErr("⚠️ Allaqachon qo'shilgan!"); return; }
      const prod = products.find(p => p.id === unit.productId);
      setScannedIds(prev => [...prev, { ...unit, prodName: prod?.name || "—" }]);
      setScanInput("");
      setScanErr("");
    };

    if (stores.length === 0 || products.length === 0) {
      return (
        <div style={s.overlay} onClick={() => setModal(null)}>
          <div style={s.sheet} onClick={e => e.stopPropagation()} className="up">
            <div style={{ ...s.row, marginBottom: 16 }}>
              <span style={{ fontSize: 17, fontWeight: 800 }}>Jo'natish</span>
              <button style={s.iBtn} onClick={() => setModal(null)}><Ic n="x" s={16} /></button>
            </div>
            <div style={{ textAlign: "center", padding: 30, color: t.sub, fontSize: 13 }}>{stores.length === 0 ? "⚠️ Avval do'kon qo'shing" : "⚠️ Avval mahsulot qo'shing"}</div>
          </div>
        </div>
      );
    }

    const availProds = products.filter(p => getWhUnits(p.id).length > 0);
    const availUnits = productId ? getWhUnits(productId) : [];
    const product = products.find(p => p.id === productId);
    const qtyN = +qty || 0;

    const send = async () => {
      if (!storeId) return alert("Do'kon tanlang");
      setSaving(true);
      let toSend = [];
      if (scanMode && scannedIds.length > 0) {
        toSend = scannedIds;
      } else {
        if (!productId) { setSaving(false); return alert("Mahsulot tanlang"); }
        if (!qtyN || qtyN <= 0) { setSaving(false); return alert("Sonini kiriting"); }
        if (qtyN > availUnits.length) { setSaving(false); return alert(`Omborda ${availUnits.length} dona`); }
        toSend = availUnits.slice(0, qtyN);
      }
      if (toSend.length === 0) { setSaving(false); return alert("Mol tanlanmagan"); }
      const updates = toSend.map(u => ({ ...u, unit_id: u.unitId, product_id: u.productId, added_at: u.addedAt, location: storeId, sent_at: sentDate + "T00:00:00.000Z" }));
      await db.from("units").upsert(updates);
      setUnits(prev => prev.map(u => toSend.find(x => x.id === u.id) ? { ...u, location: storeId, sentAt: now() } : u));
      const store = stores.find(st => st.id === storeId);
      await log("Vitrinaga jo'natildi", `${toSend.length} dona → ${store.name}`);
      setSaving(false);
      setModal(null); setSel(null);
    };

    return (
      <div style={s.overlay} onClick={() => { setModal(null); setSel(null); }}>
        <div style={s.sheet} onClick={e => e.stopPropagation()} className="up">
          <div style={{ ...s.row, marginBottom: 16 }}>
            <span style={{ fontSize: 17, fontWeight: 800 }}>📦 Vitrinaga jo'natish</span>
            <button style={s.iBtn} onClick={() => { setModal(null); setSel(null); }}><Ic n="x" s={16} /></button>
          </div>
          <Lbl>Jo'natish sanasi</Lbl>
          <input type="date" style={s.inp} value={sentDate} onChange={e => setSentDate(e.target.value)} />
          <Lbl>Qaysi do'konga</Lbl>
          <select style={s.inp} value={storeId} onChange={e => setStoreId(e.target.value)}>{stores.map(st => <option key={st.id} value={st.id}>{st.name}</option>)}</select>
          <Lbl>Mahsulot</Lbl>
          <select style={s.inp} value={productId} onChange={e => setProductId(e.target.value)}>
            <option value="">— tanlang —</option>
            {availProds.map(p => <option key={p.id} value={p.id}>{p.name} (omborda: {getWhUnits(p.id).length})</option>)}
          </select>
          {product && <div style={{ background: t.accSoft, borderRadius: 10, padding: "10px 12px", marginBottom: 11, fontSize: 12 }}><div style={s.row}><span style={{ color: t.sub }}>Omborda:</span><span style={{ ...s.mono, fontWeight: 800, color: t.acc }}>{availUnits.length} dona</span></div></div>}
          {/* Scanner/Qo'lda rejimi */}
          <div style={{ display: "flex", gap: 6, marginBottom: 11 }}>
            <button onClick={() => { setScanMode(false); setScannedIds([]); }} style={{ flex: 1, padding: "9px", borderRadius: 9, background: !scanMode ? t.acc : t.card, color: !scanMode ? "#fff" : t.sub, border: `1px solid ${!scanMode ? t.acc : t.border}`, fontWeight: 700, fontSize: 12 }}>📋 Qo'lda</button>
            <button onClick={() => setScanMode(true)} style={{ flex: 1, padding: "9px", borderRadius: 9, background: scanMode ? t.acc : t.card, color: scanMode ? "#fff" : t.sub, border: `1px solid ${scanMode ? t.acc : t.border}`, fontWeight: 700, fontSize: 12 }}>📷 Scanner</button>
          </div>

          {!scanMode ? (
            <>
              <Lbl>Nechta jo'natasiz</Lbl>
              <NumInp value={qty} onChange={setQty} placeholder="Masalan: 5" />
              {product && qtyN > 0 && qtyN <= availUnits.length && (
                <div style={{ background: t.card, borderRadius: 10, padding: 11, marginBottom: 11, fontSize: 12 }}>
                  <div style={{ color: t.sub, marginBottom: 6 }}>Tanlangan:</div>
                  <div style={{ ...s.mono, color: t.acc, fontWeight: 700 }}>{availUnits.slice(0, qtyN).map(u => u.unitId).slice(0, 3).join(", ")}{qtyN > 3 ? ` ... +${qtyN - 3}` : ""}</div>
                  <div style={{ marginTop: 8, padding: "8px 10px", background: t.amberS, borderRadius: 8, fontSize: 11, color: t.amber }}>⚠️ Vitrina qarzi: {fmt(product.price * qtyN)}</div>
                </div>
              )}
              <Btn bg={t.acc} onClick={send} disabled={!product || !qtyN || saving}>{saving ? "Jo'natilmoqda..." : "✓ Jo'natish"}</Btn>
            </>
          ) : (
            <>
              <Lbl>Scanner yoki qo'lda ID yozing</Lbl>
              <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                <input
                  style={{ ...s.inp, marginBottom: 0, flex: 1 }}
                  placeholder="JS-001-#0001"
                  value={scanInput}
                  onChange={e => handleScanInput(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && addScannedId()}
                  autoFocus
                />
                <button onClick={addScannedId} style={{ background: t.acc, color: "#fff", borderRadius: 10, padding: "0 16px", fontWeight: 700, fontSize: 18 }}>+</button>
              </div>
              {scanErr && <div style={{ color: t.red, fontSize: 12, marginBottom: 8 }}>{scanErr}</div>}
              {scannedIds.length > 0 && (
                <div style={{ background: t.card, borderRadius: 10, padding: 10, marginBottom: 11, maxHeight: 150, overflowY: "auto" }}>
                  <div style={{ ...s.row, marginBottom: 6 }}>
                    <span style={{ fontSize: 11, color: t.sub, fontWeight: 700 }}>Skanerlangan: {scannedIds.length} dona</span>
                    <button onClick={() => setScannedIds([])} style={{ fontSize: 10, color: t.red }}>Tozalash</button>
                  </div>
                  {scannedIds.map(u => (
                    <div key={u.id} style={{ ...s.row, padding: "4px 0", fontSize: 11, borderBottom: `1px solid ${t.border}33` }}>
                      <span style={{ ...s.mono, color: t.acc, fontWeight: 700 }}>{u.unitId}</span>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <span style={{ color: t.sub }}>{u.prodName}</span>
                        <button onClick={() => setScannedIds(prev => prev.filter(x => x.id !== u.id))} style={{ color: t.red, fontSize: 12 }}>✕</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
              <Btn bg={t.acc} onClick={send} disabled={scannedIds.length === 0 || saving}>{saving ? "Jo'natilmoqda..." : `✓ Jo'natish (${scannedIds.length} dona)`}</Btn>
            </>
          )}
        </div>
      </div>
    );
  };

  // ═══════════════════════════════════════════════════════════
  // MODAL: SELL
  // ═══════════════════════════════════════════════════════════
  const SellModal = () => {
    const [storeId, setStoreId] = useState(sel?.storeId || "");
    const [productId, setProductId] = useState(sel?.productId || "");
    const [qty, setQty] = useState(1);
    const [discount, setDiscount] = useState("");
    const [customerId, setCustomerId] = useState("");
    const [customerName, setCustomerName] = useState("");
    const [customerPhone, setCustomerPhone] = useState("");
    const [isPaid, setIsPaid] = useState(true);
    const [payMethod, setPayMethod] = useState("cash");
    const [date, setDate] = useState(today());
    const [debtDue, setDebtDue] = useState("");
    const [saving, setSaving] = useState(false);

    const storeProds = useMemo(() => {
      const byP = getStoreUnitsByProduct(storeId);
      return Object.entries(byP).map(([pid, us]) => ({ product: products.find(p => p.id === pid), units: us })).filter(x => x.product);
    }, [storeId, units]);

    const availUnits = productId && storeId ? getStoreUnits(storeId, productId) : [];
    const product = products.find(p => p.id === productId);
    const qtyN = +qty || 1;
    const discN = +discount || 0;
    const total = product ? Math.round(product.price * qtyN * (1 - discN / 100) * 100) / 100 : 0;

    const sell = async () => {
      if (!storeId || !product) return alert("Tanlang");
      if (qtyN > availUnits.length) return alert(`Vitrinada ${availUnits.length} dona`);
      setSaving(true);
      const soldUnits = availUnits.slice(0, qtyN);

      // Units sold qilish
      const updatedUnits = soldUnits.map(u => ({ ...u, unit_id: u.unitId, product_id: u.productId, added_at: u.addedAt, status: "sold" }));
      await db.from("units").upsert(updatedUnits);
      setUnits(prev => prev.map(u => soldUnits.find(x => x.id === u.id) ? { ...u, status: "sold" } : u));

      // Customer
      let finalCustomerId = customerId, finalCustomerName = customerName;
      if (!customerId && customerName.trim()) {
        const newC = { id: uid(), name: customerName.trim(), phone: customerPhone.trim(), created_at: now() };
        await db.from("customers").insert(newC);
        setCustomers(prev => [newC, ...prev]);
        finalCustomerId = newC.id;
      } else if (customerId) {
        finalCustomerName = customers.find(c => c.id === customerId)?.name || "";
      }

      const sale = {
        id: uid(),
        unit_ids: soldUnits.map(u => u.unitId),
        store_id: storeId, product_id: productId,
        customer_id: finalCustomerId || null, customer_name: finalCustomerName || "",
        qty: qtyN, price: total / qtyN, cost: product.cost, total_amount: total,
        paid: isPaid, pay_date: isPaid ? date : null, pay_method: isPaid ? payMethod : null,
        debt_due: !isPaid && debtDue ? debtDue : null,
        partial_payments: [], date, created_at: now(),
      };
      await db.from("sales").insert(sale);
      setSales(prev => [{ ...sale, unitIds: sale.unit_ids, storeId: sale.store_id, productId: sale.product_id, customerId: sale.customer_id, customerName: sale.customer_name, totalAmount: sale.total_amount, payDate: sale.pay_date, payMethod: sale.pay_method, partialPayments: [] }, ...prev]);

      const store = stores.find(s => s.id === storeId);
      await log("Sotildi", `${product.name} ${qtyN} dona — ${store.name} = ${fmt(total)}${!isPaid ? ' [QARZ]' : ''}`);
      setSaving(false);
      setModal(null); setSel(null);
    };

    return (
      <div style={s.overlay} onClick={() => { setModal(null); setSel(null); }}>
        <div style={s.sheet} onClick={e => e.stopPropagation()} className="up">
          <div style={{ ...s.row, marginBottom: 16 }}>
            <span style={{ fontSize: 17, fontWeight: 800 }}>💵 Sotuv yozish</span>
            <button style={s.iBtn} onClick={() => { setModal(null); setSel(null); }}><Ic n="x" s={16} /></button>
          </div>
          <Lbl>Do'kon</Lbl>
          <select style={s.inp} value={storeId} onChange={e => { setStoreId(e.target.value); setProductId(""); }}>
            <option value="">— tanlang —</option>
            {stores.map(st => <option key={st.id} value={st.id}>{st.name}</option>)}
          </select>
          {storeId && (
            <>
              <Lbl>Mahsulot</Lbl>
              <select style={s.inp} value={productId} onChange={e => setProductId(e.target.value)}>
                <option value="">— tanlang —</option>
                {storeProds.map(({ product: p, units: us }) => <option key={p.id} value={p.id}>{p.name} ({us.length} dona)</option>)}
              </select>
              {storeProds.length === 0 && <div style={{ background: t.amberS, borderRadius: 9, padding: 10, marginBottom: 11, fontSize: 12, color: t.amber }}>⚠️ Vitrinada yo'q.</div>}
            </>
          )}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>
            <div><Lbl>Soni</Lbl><NumInp value={qty} onChange={setQty} placeholder="1" /></div>
            <div><Lbl>Chegirma %</Lbl><NumInp value={discount} onChange={setDiscount} placeholder="0" /></div>
          </div>
          <Lbl>Mijoz</Lbl>
          {customers.length > 0 && (
            <select style={s.inp} value={customerId} onChange={e => { setCustomerId(e.target.value); if (e.target.value) setCustomerName(""); }}>
              <option value="">— yangi —</option>
              {customers.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          )}
          {!customerId && (
            <div>
              <input style={s.inp} placeholder="Yangi mijoz ismi *" value={customerName} onChange={e => setCustomerName(e.target.value)} />
              <input style={s.inp} placeholder="Telefon: +998901234567" value={customerPhone} onChange={e => setCustomerPhone(e.target.value)} />
            </div>
          )}
          <Lbl>Sana</Lbl>
          <input type="date" style={s.inp} value={date} onChange={e => setDate(e.target.value)} />
          <div style={{ background: t.card, border: `1px solid ${t.border}`, borderRadius: 11, padding: 12, marginBottom: 11 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: t.sub, marginBottom: 10, textTransform: "uppercase" }}>To'lov holati</div>
            <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
              <button onClick={() => setIsPaid(true)} style={{ flex: 1, padding: "10px", borderRadius: 9, background: isPaid ? t.green : t.card, border: `1.5px solid ${isPaid ? t.green : t.border}`, color: isPaid ? "#fff" : t.sub, fontWeight: 700, fontSize: 13 }}>✓ To'landi</button>
              <button onClick={() => setIsPaid(false)} style={{ flex: 1, padding: "10px", borderRadius: 9, background: !isPaid ? t.red : t.card, border: `1.5px solid ${!isPaid ? t.red : t.border}`, color: !isPaid ? "#fff" : t.sub, fontWeight: 700, fontSize: 13 }}>📝 Qarzga</button>
            </div>
            {isPaid && <select style={{ ...s.inp, marginBottom: 0 }} value={payMethod} onChange={e => setPayMethod(e.target.value)}>{Object.entries(PAY).map(([k, v]) => <option key={k} value={k}>{v.emoji} {v.label}</option>)}</select>}
            {!isPaid && (
              <div>
                <Lbl>To'lash muddati</Lbl>
                <input type="date" style={{ ...s.inp, marginBottom: 0 }} value={debtDue} onChange={e => setDebtDue(e.target.value)} />
              </div>
            )}
          </div>
          {product && qtyN > 0 && (
            <div style={{ background: isPaid ? t.greenS : t.redS, borderRadius: 11, padding: 13, marginBottom: 11 }}>
              <div style={{ ...s.row, marginBottom: 6 }}><span style={{ fontSize: 12, color: t.sub }}>Jami</span><span style={{ ...s.mono, fontWeight: 800, color: isPaid ? t.green : t.red, fontSize: 17 }}>{fmt(total)}</span></div>
              {canSee("profit") && <div style={s.row}><span style={{ fontSize: 12, color: t.sub }}>Foyda</span><span style={{ ...s.mono, fontWeight: 700, color: t.green }}>{fmt(total - product.cost * qtyN)}</span></div>}
            </div>
          )}
          <Btn bg={isPaid ? t.green : t.amber} onClick={sell} disabled={!product || saving}>{saving ? "Saqlanmoqda..." : isPaid ? "✓ Tasdiqlash" : "📝 Qarzga"}</Btn>
        </div>
      </div>
    );
  };

  // ═══════════════════════════════════════════════════════════
  // MODAL: PAY
  // ═══════════════════════════════════════════════════════════
  const PayModal = () => {
    const sale = sales.find(x => x.id === sel?.saleId);
    if (!sale) return null;
    const pp = (sale.partialPayments || []).reduce((sum, p) => sum + p.amount, 0);
    const remaining = sale.totalAmount - pp;
    const [amount, setAmount] = useState(remaining);
    const [method, setMethod] = useState("cash");
    const [date, setDate] = useState(today());
    const [saving, setSaving] = useState(false);

    const conf = async () => {
      const amt = +amount;
      if (!amt || amt <= 0) return alert("Summa");
      if (amt > remaining) return alert(`Qolgan: ${fmt(remaining)}`);
      setSaving(true);
      const isFull = amt >= remaining;
      const payment = { id: uid(), amount: amt, method, date };
      const newPartials = [...(sale.partialPayments || []), payment];
      const updated = {
        ...sale,
        unit_ids: sale.unitIds,
        store_id: sale.storeId, product_id: sale.productId,
        customer_id: sale.customerId, customer_name: sale.customerName,
        total_amount: sale.totalAmount, pay_date: isFull ? date : sale.payDate,
        pay_method: isFull ? method : sale.payMethod,
        partial_payments: newPartials, paid: isFull,
      };

  // MODAL: RETURN

  const ReturnModal = () => {
    const store = stores.find(s => s.id === sel?.storeId);
    const product = products.find(p => p.id === sel?.productId);
    const availUnits = getStoreUnits(sel?.storeId, sel?.productId);
    const [qty, setQty] = useState(1);
    const [saving, setSaving] = useState(false);
    if (!store || !product) return null;
    const ret = async () => {
      const q = +qty || 1;
      if (q > availUnits.length) return alert(`Vitrinada ${availUnits.length} dona`);
      setSaving(true);
      const toRet = availUnits.slice(0, q);
      const updates = toRet.map(u => ({ ...u, unit_id: u.unitId, product_id: u.productId, added_at: u.addedAt, location: "warehouse", sent_at: null }));
      await db.from("units").upsert(updates);
      setUnits(prev => prev.map(u => toRet.find(r => r.id === u.id) ? { ...u, location: "warehouse", sentAt: undefined } : u));
      await log("Vitrinadan qaytarildi", `${product.name} ${q} dona — ${store.name}`);
      setSaving(false);
      setModal(null); setSel(null);
    };
    return (
      <div style={s.overlay} onClick={() => { setModal(null); setSel(null); }}>
        <div style={s.sheet} onClick={e => e.stopPropagation()} className="up">
          <div style={{ ...s.row, marginBottom: 16 }}>
            <span style={{ fontSize: 17, fontWeight: 800 }}>↩️ Qaytarish</span>
            <button style={s.iBtn} onClick={() => { setModal(null); setSel(null); }}><Ic n="x" s={16} /></button>
          </div>
          <div style={{ background: t.amberS, borderRadius: 11, padding: 12, marginBottom: 14, fontSize: 12, color: t.amber }}><b>{product.name}</b><br />{store.name} → omborga</div>
          <Lbl>Nechta (mavjud: {availUnits.length})</Lbl>
          <NumInp value={qty} onChange={setQty} placeholder="1" />
          <Btn bg={t.amber} onClick={ret} disabled={saving}>{saving ? "Qaytarilmoqda..." : "✓ Qaytarish"}</Btn>
        </div>
      </div>
    );
  };

  const OrderModal = () => {
    const existing = sel?.editOrder;
    const [f, setF] = useState(existing || { storeId: stores[0]?.id || "", productId: "", qty: 1, note: "", deadline: "", price: "", prepaid: "", status: "pending" });
    const [saving, setSaving] = useState(false);
    const product = products.find(p => p.id === f.productId);
    const orderNumber = existing?.orderId || `ZK-${pad4(orders.length + 1)}`;

    const save = async () => {
      if (!f.storeId || !f.productId) return alert("Tanlang");
      if (!f.deadline) return alert("Srok");
      setSaving(true);
      if (existing) {
        const updated = { ...existing, ...f, store_id: f.storeId, product_id: f.productId, order_id: existing.orderId, status_history: existing.statusHistory || [] };
        await db.from("orders").upsert(updated);
        setOrders(prev => prev.map(o => o.id === existing.id ? { ...o, ...f } : o));
        await log("Zakaz tahrirlandi", existing.orderId);
      } else {
        const newOrder = {
          id: uid(), order_id: orderNumber,
          store_id: f.storeId, product_id: f.productId,
          qty: +f.qty || 1, note: f.note, deadline: f.deadline,
          price: +f.price || 0, prepaid: +f.prepaid || 0,
          status: "pending", status_history: [{ status: "pending", time: now() }],
          created_at: now(),
        };
        await db.from("orders").insert(newOrder);
        setOrders(prev => [{ ...newOrder, orderId: newOrder.order_id, storeId: newOrder.store_id, productId: newOrder.product_id, statusHistory: newOrder.status_history }, ...prev]);
        await log("Zakaz qo'shildi", `${orderNumber} — ${product?.name}`);
      }
      setSaving(false);
      setModal(null); setSel(null);
    };

    return (
      <div style={s.overlay} onClick={() => { setModal(null); setSel(null); }}>

            {stores.map(st => <option key={st.id} value={st.id}>{st.name}</option>)}
          </select>
          <Lbl>Qaysi modelga o'xshash</Lbl>
          <select style={s.inp} value={f.productId} onChange={e => setF(p => ({ ...p, productId: e.target.value }))}>
            <option value="">— tanlang —</option>
            {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>

          <NumInp value={f.prepaid} onChange={v => setF(p => ({ ...p, prepaid: v }))} placeholder="0" />

            <>
              <Lbl>Status</Lbl>

            </>
          )}
          <Btn bg={t.acc} onClick={save} disabled={saving}>{saving ? "Saqlanmoqda..." : existing ? "Saqlash" : "Zakaz qo'shish"}</Btn>
        </div>
      </div>

                          if (allSel) setSelectedIds(prev => prev.filter(id => !ids.includes(id)));
                          else setSelectedIds(prev => [...new Set([...prev, ...ids])]);
                        }} style={{ fontSize: 11, color: t.acc, fontWeight: 700, background: t.accSoft, borderRadius: 7, padding: "4px 10px" }}>
                          {p.allUnits.every(u => selectedIds.includes(u.id)) ? "✕ Barchasini olib tashla" : "☑ Hammasini belgilab"}
                        </button>
                        {selectedIds.filter(id => p.allUnits.find(u => u.id === id)).length > 0 && (
                          <button onClick={() => {
                            const ids = selectedIds.filter(id => p.allUnits.find(u => u.id === id));
                            printYorliq(ids);
                          }} style={{ fontSize: 11, color: "#fff", fontWeight: 700, background: t.acc, borderRadius: 7, padding: "4px 10px" }}>
                            🖨️ Chiqar ({selectedIds.filter(id => p.allUnits.find(u => u.id === id)).length})
                          </button>
                        )}
                      </div>
                      {p.allUnits.slice().reverse().map(u => {
                        const loc = u.status === "sold" ? "Sotildi" : u.location === "warehouse" ? "Omborda" : stores.find(s => s.id === u.location)?.name || "—";
                        const lc = u.status === "sold" ? t.green : u.location === "warehouse" ? t.acc : t.blue;
                        const isChecked = selectedIds.includes(u.id);
                        return (
                          <div key={u.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", borderBottom: `1px solid ${t.border}33`, fontSize: 11 }}>
                            <button onClick={() => setSelectedIds(prev => isChecked ? prev.filter(id => id !== u.id) : [...prev, u.id])}
                              style={{ width: 20, height: 20, borderRadius: 5, border: `2px solid ${isChecked ? t.acc : t.border}`, background: isChecked ? t.acc : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                              {isChecked && <span style={{ color: "#fff", fontSize: 10, fontWeight: 800 }}>✓</span>}
                            </button>
                            <span style={{ ...s.mono, fontWeight: 700, flex: 1 }}>{u.unitId}</span>
                            <div style={{ textAlign: "right" }}>
                              <span style={{ ...s.mono, color: lc, fontWeight: 700 }}>{loc}</span>
                              <div style={{ color: t.sub, fontSize: 10 }}>{dateStr(u.addedAt)}</div>
                            </div>
                            <button onClick={() => printYorliq([u.id])} style={{ color: t.sub, padding: "2px 4px", fontSize: 13 }}>🖨️</button>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </>
        )}
      </div>
    );
  };

  // ═══════════════════════════════════════════════════════════
  // PAGE: STORES
  // ═══════════════════════════════════════════════════════════
  const StoresPage = () => {
    if (storeProfileId) return <StoreProfile />;
    return (
      <div className="fade">
        <div style={{ ...s.row, marginBottom: 14 }}>
          <div>
            <div style={{ fontSize: 22, fontWeight: 800 }}>🏪 Do'konlar</div>
            <div style={{ fontSize: 12, color: t.sub, marginTop: 2 }}>Jami: {stores.length} ta</div>
          </div>
          {canSee("price") && <button onClick={() => setModal("addstore")} style={{ background: t.acc, color: "#fff", borderRadius: 10, padding: "8px 14px", fontWeight: 700, fontSize: 13, display: "flex", alignItems: "center", gap: 6 }}><Ic n="plus" s={14} /> Yangi</button>}
        </div>
        {stores.length === 0 ? (
          <Empty icon="store" title="Do'kon yo'q" desc="Birinchi do'koningizni qo'shing" btnText="Do'kon qo'shish" onBtn={() => setModal("addstore")} />
        ) : (
          stores.map(store => {
            const sUnits = units.filter(u => u.location === store.id && u.status === "available");
            const sSales = sales.filter(s => s.storeId === store.id);
            const sDebt = sUnits.reduce((sum, u) => sum + (products.find(p => p.id === u.productId)?.price || 0), 0);
            const sRev = sSales.reduce((sum, s) => sum + s.totalAmount, 0);
            return (
              <button key={store.id} onClick={() => setStoreProfileId(store.id)} className="press" style={{ ...s.card, width: "100%", textAlign: "left" }}>

                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 15, fontWeight: 700 }}>🏪 {store.name}</div>
                    {store.address && <div style={{ fontSize: 11, color: t.sub, marginTop: 2 }}>📍 {store.address}</div>}
                    {store.manager && <div style={{ fontSize: 11, color: t.sub }}>👤 {store.manager}</div>}
                  </div>
                  <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                    <button onClick={(e) => {
                      e.stopPropagation();
                      askConfirm("Do'konni o'chirish", `"${store.name}" o'chirilsinmi?${sUnits.length > 0 ? `\n\n⚠️ ${sUnits.length} ta mol omborga qaytariladi` : ''}`, async () => {
                        const toReturn = sUnits.map(u => ({ ...u, unit_id: u.unitId, product_id: u.productId, added_at: u.addedAt, location: "warehouse", sent_at: null }));
                        if (toReturn.length > 0) await db.from("units").upsert(toReturn);
                        await db.from("stores").delete().eq("id", store.id);
                        setUnits(prev => prev.map(u => u.location === store.id ? { ...u, location: "warehouse", sentAt: undefined } : u));
                        setStores(prev => prev.filter(x => x.id !== store.id));
                        await log("Do'kon o'chirildi", store.name);
                      }, true);
                    }} style={{ background: t.redS, color: t.red, borderRadius: 8, padding: "6px 8px" }}><Ic n="trash" s={13} /></button>
                    <Ic n="right" s={18} />
                  </div>
                </div>
                <Div />
                <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8 }}>
                  <div style={{ background: t.blueS, borderRadius: 8, padding: "8px 10px", textAlign: "center" }}>
                    <div style={{ fontSize: 16, fontWeight: 800, color: t.blue, ...s.mono }}>{sUnits.length}</div>
                    <div style={{ fontSize: 9, color: t.sub }}>VITRINADA</div>
                  </div>
                  <div style={{ background: t.redS, borderRadius: 8, padding: "8px 10px", textAlign: "center" }}>
                    <div style={{ fontSize: 14, fontWeight: 800, color: t.red, ...s.mono }}>{fmtK(sDebt)}</div>
                    <div style={{ fontSize: 9, color: t.sub }}>QARZ</div>
                  </div>
                  <div style={{ background: t.greenS, borderRadius: 8, padding: "8px 10px", textAlign: "center" }}>
                    <div style={{ fontSize: 14, fontWeight: 800, color: t.green, ...s.mono }}>{fmtK(sRev)}</div>

                  </div>
                </div>
              </button>
            );
          })
        )}
      </div>
    );
  };

  // STORE PROFILE
  const StoreProfile = () => {
    const store = stores.find(s => s.id === storeProfileId);
    const [pTab, setPTab] = useState("vitrina");
    if (!store) { setStoreProfileId(null); return null; }
    const sUnits = units.filter(u => u.location === store.id && u.status === "available");
    const unitsByProd = {};
    sUnits.forEach(u => {
      if (!unitsByProd[u.productId]) unitsByProd[u.productId] = [];
      unitsByProd[u.productId].push(u);
    });
    const sSales = sales.filter(s => s.storeId === store.id).sort((a, b) => b.date.localeCompare(a.date));
    const sOrders = orders.filter(o => o.storeId === store.id);
    const allPayments = [];
    sSales.forEach(s => {
      if (s.paid && s.payDate) allPayments.push({ id: s.id + "-full", saleId: s.id, amount: s.totalAmount, method: s.payMethod, date: s.payDate, customerName: s.customerName, productId: s.productId });
      (s.partialPayments || []).forEach(p => allPayments.push({ id: p.id, saleId: s.id, amount: p.amount, method: p.method, date: p.date, customerName: s.customerName, productId: s.productId }));
    });
    allPayments.sort((a, b) => b.date.localeCompare(a.date));
    const sDebt = sUnits.reduce((sum, u) => sum + (products.find(p => p.id === u.productId)?.price || 0), 0);
    const totalRev = sSales.reduce((sum, s) => sum + s.totalAmount, 0);
    const totalPaidStore = allPayments.reduce((sum, p) => sum + p.amount, 0);
    const custDebt = sSales.reduce((sum, s) => {
      if (s.paid) return sum;
      const pp = (s.partialPayments || []).reduce((a, p) => a + p.amount, 0);
      return sum + (s.totalAmount - pp);
    }, 0);
    return (
      <div className="fade">
        <button onClick={() => setStoreProfileId(null)} style={{ display: "flex", alignItems: "center", gap: 6, color: t.sub, fontSize: 14, fontWeight: 600, marginBottom: 14 }}>
          <Ic n="back" s={16} /> Do'konlar
        </button>
        <div style={{ background: `linear-gradient(135deg, ${t.acc}, ${t.blue})`, borderRadius: 16, padding: 16, marginBottom: 14, color: "#fff" }}>
          <div style={{ fontSize: 18, fontWeight: 800, marginBottom: 4 }}>🏪 {store.name}</div>
          {store.address && <div style={{ fontSize: 12, opacity: 0.8 }}>📍 {store.address}</div>}
          {store.manager && <div style={{ fontSize: 12, opacity: 0.8 }}>👤 {store.manager}{store.phone ? ` · ${store.phone}` : ''}</div>}
          <div style={{ borderTop: "1px solid #ffffff22", margin: "12px 0" }} />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            <div style={{ background: "#ffffff15", borderRadius: 9, padding: 10 }}><div style={{ fontSize: 10, opacity: 0.7 }}>VITRINA QARZI</div><div style={{ fontSize: 17, fontWeight: 800, ...s.mono }}>{fmtK(sDebt)}</div></div>
            <div style={{ background: "#ffffff15", borderRadius: 9, padding: 10 }}><div style={{ fontSize: 10, opacity: 0.7 }}>MIJOZ QARZI</div><div style={{ fontSize: 17, fontWeight: 800, ...s.mono, color: custDebt > 0 ? "#FFAAAA" : "#fff" }}>{fmtK(custDebt)}</div></div>
            <div style={{ background: "#ffffff15", borderRadius: 9, padding: 10 }}><div style={{ fontSize: 10, opacity: 0.7 }}>JAMI SOTUV</div><div style={{ fontSize: 17, fontWeight: 800, ...s.mono }}>{fmtK(totalRev)}</div></div>
            <div style={{ background: "#ffffff15", borderRadius: 9, padding: 10 }}><div style={{ fontSize: 10, opacity: 0.7 }}>OLINGAN PUL</div><div style={{ fontSize: 17, fontWeight: 800, ...s.mono }}>{fmtK(totalPaidStore)}</div></div>
          </div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 14 }}>
          <button onClick={() => { setSel({ storeId: store.id }); setModal("transfer"); }} className="press" style={{ background: t.acc, color: "#fff", borderRadius: 10, padding: "11px 8px", fontWeight: 700, fontSize: 12, display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }}><Ic n="send" s={16} /> Jo'natish</button>
          <button onClick={() => { setSel({ storeId: store.id }); setModal("sell"); }} className="press" style={{ background: t.green, color: "#fff", borderRadius: 10, padding: "11px 8px", fontWeight: 700, fontSize: 12, display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }}><Ic n="money" s={16} /> Sotuv</button>
          <button onClick={() => { setSel({ storeId: store.id }); setModal("order"); }} className="press" style={{ background: t.amber, color: "#fff", borderRadius: 10, padding: "11px 8px", fontWeight: 700, fontSize: 12, display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }}><Ic n="order" s={16} /> Zakaz</button>
        </div>
        <div style={{ display: "flex", gap: 6, marginBottom: 12, background: t.card, padding: 4, borderRadius: 11, border: `1px solid ${t.border}` }}>
          {[{ id: "vitrina", l: "Vitrina", n: sUnits.length }, { id: "sales", l: "Sotuv", n: sSales.length }, { id: "payments", l: "To'lov", n: allPayments.length }, { id: "orders", l: "Zakaz", n: sOrders.length }].map(x => (
            <button key={x.id} onClick={() => setPTab(x.id)} style={{ flex: 1, padding: "8px 4px", borderRadius: 8, background: pTab === x.id ? t.acc : "transparent", color: pTab === x.id ? "#fff" : t.sub, fontSize: 11, fontWeight: 700 }}>{x.l} {x.n > 0 && <span style={{ opacity: 0.7 }}>· {x.n}</span>}</button>
          ))}
        </div>
        {pTab === "vitrina" && (
          Object.keys(unitsByProd).length === 0 ? (
            <div style={{ ...s.card, textAlign: "center", padding: 30, color: t.sub, fontSize: 13 }}>Vitrinada mol yo'q</div>
          ) : Object.entries(unitsByProd).map(([pid, us]) => {
            const prod = products.find(p => p.id === pid);
            if (!prod) return null;
            return (
              <div key={pid} style={s.card}>
                <div style={s.row}>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 700 }}>{prod.name}</div>
                    <div style={{ fontSize: 11, color: t.sub, ...s.mono }}>{prod.sku} · {fmt(prod.price)}/dona</div>
                  </div>
                  <Badge c={t.blue} bg={t.blueS}>{us.length} dona</Badge>
                </div>
                <div style={{ marginTop: 10, padding: 10, background: t.surf, borderRadius: 9, maxHeight: 120, overflowY: "auto" }}>
                  {us.map(u => (
                    <div key={u.id} style={{ ...s.row, padding: "5px 0", fontSize: 11 }}>
                      <span style={{ ...s.mono, fontWeight: 700 }}>{u.unitId}</span>
                      <span style={{ color: t.sub }}>{dateStr(u.sentAt)}</span>
                    </div>
                  ))}
                </div>
                <div style={{ display: "flex", gap: 6, marginTop: 10 }}>
                  <button onClick={() => { setSel({ storeId: store.id, productId: pid }); setModal("sell"); }} style={{ flex: 1, background: t.green, color: "#fff", borderRadius: 8, padding: "8px", fontSize: 12, fontWeight: 700 }}>Sotish</button>
                  <button onClick={() => { setSel({ storeId: store.id, productId: pid }); setModal("return"); }} style={{ background: t.amberS, color: t.amber, borderRadius: 8, padding: "8px 12px", fontSize: 12, fontWeight: 700 }}>↩️ Qaytar</button>
                </div>
              </div>
            );
          })
        )}
        {pTab === "sales" && (
          sSales.length === 0 ? (
            <div style={{ ...s.card, textAlign: "center", padding: 30, color: t.sub, fontSize: 13 }}>Sotuvlar yo'q</div>
          ) : sSales.map(sr => {
            const prod = products.find(p => p.id === sr.productId);
            const pp = (sr.partialPayments || []).reduce((a, p) => a + p.amount, 0);
            const remaining = sr.totalAmount - pp;
            return (
              <div key={sr.id} style={s.card}>
                <div style={s.row}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 14, fontWeight: 700 }}>{prod?.name}</div>
                    <div style={{ fontSize: 11, color: t.sub }}>{dateStr(sr.date)} · {sr.qty} dona</div>
                    {sr.customerName && <div style={{ fontSize: 11, color: t.sub }}>👤 {sr.customerName}</div>}
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: 15, fontWeight: 800, color: sr.paid ? t.green : t.red, ...s.mono }}>{fmt(sr.totalAmount)}</div>
                    {sr.paid ? <div style={{ fontSize: 10, color: t.green }}>✓ {PAYMENT_INFO[sr.payMethod]?.emoji}</div> : <Badge c={t.red} bg={t.redS}>QARZ: {fmtK(remaining)}</Badge>}
                  </div>
                </div>
                {!sr.paid && <Btn bg={t.amber} mt={9} small onClick={() => { setSel({ saleId: sr.id }); setModal("pay"); }}>💰 Pul olish</Btn>}
                <button onClick={() => {
                  const saleUnitIds = units.filter(u => sr.unitIds?.includes(u.unitId)).map(u => u.id);
                  if(saleUnitIds.length > 0) printGarantiya(saleUnitIds);
                }} style={{ width: "100%", marginTop: 6, background: t.card, border: `1px solid ${t.border}`, borderRadius: 8, padding: "7px", fontSize: 11, fontWeight: 700, color: t.sub, display: "flex", alignItems: "center", justifyContent: "center", gap: 5 }}>
                  🖨️ Garantiya taloni
                </button>
              </div>
            );
          })
        )}
        {pTab === "payments" && (
          allPayments.length === 0 ? (
            <div style={{ ...s.card, textAlign: "center", padding: 30, color: t.sub, fontSize: 13 }}>To'lovlar yo'q</div>
          ) : allPayments.map(pmt => {
            const prod = products.find(p => p.id === pmt.productId);
            return (
              <div key={pmt.id} style={s.card}>
                <div style={s.row}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 14, fontWeight: 700 }}>{prod?.name}</div>
                    <div style={{ fontSize: 11, color: t.sub }}>{dateStr(pmt.date)} · {PAYMENT_INFO[pmt.method]?.emoji} {PAYMENT_INFO[pmt.method]?.label}</div>
                    {pmt.customerName && <div style={{ fontSize: 11, color: t.sub }}>👤 {pmt.customerName}</div>}
                  </div>
                  <div style={{ ...s.mono, fontWeight: 800, color: t.green, fontSize: 15 }}>+{fmt(pmt.amount)}</div>
                </div>
              </div>
            );
          })
        )}
        {pTab === "orders" && (
          sOrders.length === 0 ? (
            <div style={{ ...s.card, textAlign: "center", padding: 30, color: t.sub, fontSize: 13 }}>Zakazlar yo'q</div>
          ) : sOrders.map(o => {
            const prod = products.find(p => p.id === o.productId);
            const dl = daysLeft(o.deadline);
            const stInfo = ORDER_STATUS[o.status];
            return (
              <div key={o.id} style={s.card}>
                <div style={s.row}>
                  <div style={{ flex: 1 }}>
                    <div style={{ ...s.mono, fontSize: 12, color: t.acc, fontWeight: 700 }}>{o.orderId}</div>
                    <div style={{ fontSize: 13, fontWeight: 700, marginTop: 2 }}>{prod?.name} × {o.qty}</div>
                    {o.note && <div style={{ fontSize: 11, color: t.sub, marginTop: 3, fontStyle: "italic" }}>"{o.note}"</div>}
                  </div>
                  <Badge c={t[stInfo.color]} bg={t[stInfo.color + "S"]}>{stInfo.emoji} {stInfo.label}</Badge>
                </div>
                <div style={{ ...s.row, marginTop: 9, fontSize: 11 }}>
                  <span style={{ color: dl !== null && dl <= 3 ? t.red : t.sub }}>{dateStr(o.deadline)}{dl !== null && ` (${dl < 0 ? `${Math.abs(dl)} kun o'tdi` : `${dl} kun qoldi`})`}</span>
                  <span style={{ ...s.mono, color: t.sub }}>{fmtK(o.prepaid)}/{fmtK(o.price)}</span>
                </div>
              </div>
            );
          })
        )}
      </div>
    );
  };

  // ═══════════════════════════════════════════════════════════
  // PAGE: ORDERS
  // ═══════════════════════════════════════════════════════════
  const OrdersPage = () => {
    const [filter, setFilter] = useState("all");
    const filtered = orders.filter(o => filter === "all" || o.status === filter).sort((a, b) => {
      if (a.status === "delivered" && b.status !== "delivered") return 1;
      if (a.status !== "delivered" && b.status === "delivered") return -1;
      return (a.deadline || "9999").localeCompare(b.deadline || "9999");
    });
    return (
      <div className="fade">
        <div style={{ ...s.row, marginBottom: 14 }}>
          <div>
            <div style={{ fontSize: 22, fontWeight: 800 }}>📋 Zakazlar</div>
            <div style={{ fontSize: 12, color: t.sub, marginTop: 2 }}>Jami: {orders.length} ta</div>
          </div>
          <button onClick={() => setModal("order")} style={{ background: t.acc, color: "#fff", borderRadius: 10, padding: "8px 14px", fontWeight: 700, fontSize: 13, display: "flex", alignItems: "center", gap: 6 }}><Ic n="plus" s={14} /> Yangi</button>
        </div>
        <div style={{ display: "flex", gap: 6, overflowX: "auto", marginBottom: 12, paddingBottom: 4 }}>
          {[{ id: "all", l: "Hammasi" }, ...Object.entries(ORDER_STATUS).map(([k, v]) => ({ id: k, l: `${v.emoji} ${v.label}` }))].map(x => (
            <button key={x.id} onClick={() => setFilter(x.id)} style={{ padding: "7px 14px", borderRadius: 18, background: filter === x.id ? t.acc : t.card, color: filter === x.id ? "#fff" : t.sub, fontSize: 12, fontWeight: 700, border: `1px solid ${filter === x.id ? t.acc : t.border}`, whiteSpace: "nowrap", flexShrink: 0 }}>{x.l}</button>
          ))}
        </div>
        {filtered.length === 0 ? (
          <Empty icon="order" title="Zakaz yo'q" desc="Do'konlar bergan zakazlarni shu yerda yozasiz" btnText="Zakaz qo'shish" onBtn={() => setModal("order")} />
        ) : filtered.map(o => {
          const prod = products.find(p => p.id === o.productId);
          const store = stores.find(s => s.id === o.storeId);
          const dl = daysLeft(o.deadline);
          const stInfo = ORDER_STATUS[o.status];
          const isUrg = dl !== null && dl <= 3 && o.status !== "delivered";
          return (
            <div key={o.id} style={{ ...s.card, border: isUrg ? `1px solid ${t.red}55` : `1px solid ${t.border}` }}>
              <div style={s.row}>
                <div style={{ flex: 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                    <span style={{ ...s.mono, fontSize: 13, color: t.acc, fontWeight: 800 }}>{o.orderId}</span>
                    <Badge c={t[stInfo.color]} bg={t[stInfo.color + "S"]}>{stInfo.emoji} {stInfo.label}</Badge>
                  </div>
                  <div style={{ fontSize: 14, fontWeight: 700 }}>{prod?.name} × {o.qty}</div>
                  <div style={{ fontSize: 11, color: t.sub, marginTop: 2 }}>🏪 {store?.name}</div>
                  {o.note && <div style={{ fontSize: 11, color: t.sub, marginTop: 4, fontStyle: "italic", padding: "6px 9px", background: t.surf, borderRadius: 7 }}>"{o.note}"</div>}
                </div>
                <button onClick={() => askConfirm("Zakazni o'chirish", `${o.orderId} o'chirilsinmi?`, async () => {
                  await db.from("orders").delete().eq("id", o.id);
                  setOrders(prev => prev.filter(x => x.id !== o.id));
                  await log("Zakaz o'chirildi", o.orderId);
                }, true)} style={{ background: t.redS, color: t.red, borderRadius: 8, padding: "6px 8px" }}><Ic n="trash" s={13} /></button>
              </div>
              <Div />
              <div style={{ ...s.row, fontSize: 11 }}>
                <div style={{ color: isUrg ? t.red : t.sub, fontWeight: 700 }}>📅 {dateStr(o.deadline)}{dl !== null && <span> ({dl < 0 ? `${Math.abs(dl)} kun kechikdi!` : dl === 0 ? "BUGUN!" : `${dl} kun qoldi`})</span>}</div>
                <div style={{ ...s.mono, color: t.sub }}>{fmtK(o.prepaid)}/{fmtK(o.price)}</div>

      productSales[s.productId].profit += (s.price - s.cost) * s.qty;

                      </div>
                      <div style={{ fontSize: 9, color: t.sub, fontWeight: 600 }}>{m.label}</div>
                      <div style={{ fontSize: 9, color: t.acc, fontWeight: 700 }}>{m.rev > 0 ? fmtK(m.rev) : "—"}</div>
                    </div>
                  ))}
                </div>
                <div style={{ display: "flex", gap: 16, justifyContent: "center" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11 }}>

                    <span style={{ color: t.sub }}>Foyda</span>
                  </div>
                </div>

              <div style={{ fontSize: 17, fontWeight: 800, marginBottom: 10 }}>{confirmDialog.title}</div>
              <div style={{ fontSize: 13, color: t.sub, lineHeight: 1.5, marginBottom: 22, whiteSpace: "pre-line" }}>{confirmDialog.message}</div>
            </div>
            <div style={{ display: "flex", gap: 9 }}>
              <button onClick={() => setConfirmDialog(null)} style={{ flex: 1, background: t.card, border: `1px solid ${t.border}`, color: t.txt, borderRadius: 11, padding: "13px", fontWeight: 700, fontSize: 14 }}>Bekor</button>
              <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog(null); }} style={{ flex: 1, background: confirmDialog.danger ? t.red : t.acc, color: "#fff", borderRadius: 11, padding: "13px", fontWeight: 700, fontSize: 14 }}>{confirmDialog.danger ? "🗑️ O'chirish" : "✓ Tasdiqlash"}</button>
            </div>
          </div>
        </div>
      )}

      {printData && (
        <div style={{ position: "fixed", inset: 0, background: "#000000CC", zIndex: 300, display: "flex", flexDirection: "column" }}>
          <div style={{ background: "#1A1A30", padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0 }}>
            <div>
              <div style={{ fontSize: 14, fontWeight: 800, color: "#fff" }}>
                {printData.type === 'yorliq' ? `🖨️ Yorliq — ${printData.count} ta` : '📜 Garantiya taloni'}
              </div>
              <div style={{ fontSize: 11, color: "#7777AA", marginTop: 2 }}>Ko'rib Ctrl+P bosing</div>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => { document.getElementById('printFrame').contentWindow.focus(); document.getElementById('printFrame').contentWindow.print(); }}
                style={{ background: "#7B73FF", color: "#fff", borderRadius: 10, padding: "9px 18px", fontWeight: 700, fontSize: 13, border: "none", cursor: "pointer" }}>🖨️ Print</button>
              <button onClick={() => setPrintData(null)}
                style={{ background: "#22223A", color: "#fff", borderRadius: 10, padding: "9px 14px", fontWeight: 700, fontSize: 13, border: "none", cursor: "pointer" }}>✕</button>
            </div>
          </div>
          <iframe id="printFrame" srcDoc={printData.html} style={{ flex: 1, border: "none", background: "white" }} title="Print" onLoad={() => {
            // Barcode yuklanishi uchun biroz kutamiz
          }} />
        </div>
      )}
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
